<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lan Anh OS 9</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pl:#dddddd;--pl2:#c4c4c4;--pl3:#a8a8a8;--ink:#000;--sel:#9a9ad0;--acc:#3a3a9a;--f-u:'Pixelify Sans',sans-serif;--f-b:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:400 13px/1.4 var(--f-b);color:#000;-webkit-user-select:none;user-select:none;background:#6c73a8}
body{background:
 radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 45%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px),
 repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px),
 linear-gradient(135deg,#7e86bb,#5f68a0 55%,#4d5690)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:default}
a{color:#1a1aa8}

/* ---------- menu bar ---------- */
#mb{position:fixed;top:0;left:0;right:0;height:24px;z-index:9000;display:flex;align-items:center;background:linear-gradient(#f4f4f4,#d4d4d4);border-bottom:1px solid #000;box-shadow:0 1px 0 #fff inset;font:600 13px var(--f-b)}
#mb .m{position:relative;height:100%}
#mb .m>button{height:100%;padding:0 13px;font-weight:600}
#mb .m>button:hover,#mb .m.open>button{background:#000;color:#fff}
#mb .logo{width:26px;height:16px;margin:0 8px 0 6px;border-radius:3px;background:conic-gradient(from 180deg,#e03a3a,#f0a030,#e8d830,#48b848,#3a8ae0,#9a4ac8,#e03a3a);border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.dd{position:absolute;left:0;top:23px;min-width:200px;background:#e8e8e8;border:1px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.4);padding:2px 0;display:none;z-index:9100}
#mb .m.open .dd{display:block}
.dd button{display:flex;justify-content:space-between;gap:30px;width:100%;padding:3px 20px 3px 18px;text-align:left;font-weight:500}
.dd button:hover:not(.dis){background:#000;color:#fff}
.dd .dis{color:#888}.dd hr{border:0;border-top:1px solid #aaa;margin:3px 0}
.dd kbd{font:500 12px var(--f-b);opacity:.7}
#mb .sp{flex:1}#mb .ck{padding:0 12px;font-weight:500;white-space:nowrap}#mb .usr{padding:0 12px;font-weight:600;display:flex;gap:8px;align-items:center;border-left:1px solid #999;height:100%}
#mb .usr i{width:14px;height:14px;background:#4a4;border-radius:50%;border:1px solid #000}

/* ---------- icons ---------- */
#ic{position:fixed;right:14px;top:34px;bottom:96px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:8px 6px;z-index:10}
.ico{width:94px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;text-align:center}
.ico svg{width:46px;height:46px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.ico span{font:500 12px/1.15 var(--f-b);padding:1px 5px;color:#fff;text-shadow:1px 1px 0 #000;border-radius:2px;max-width:92px;overflow-wrap:anywhere}
.ico.sel svg{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35)) brightness(.55) sepia(1) hue-rotate(200deg) saturate(3)}
.ico.sel span{background:#000;color:#fff;text-shadow:none}

/* ---------- windows ---------- */
.win{position:fixed;background:var(--pl);border:1px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #888,3px 4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:260px;min-height:120px;z-index:100}
.win.act{box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #888,4px 6px 0 rgba(0,0,0,.45)}
.tb{position:relative;height:22px;flex:none;display:flex;align-items:center;gap:8px;padding:0 5px;margin:2px 2px 0;touch-action:none;cursor:default;background:repeating-linear-gradient(180deg,#fff 0 1px,#bdbdbd 1px 2px);border:1px solid #777}
.win:not(.act) .tb{background:#d4d4d4;border-color:#999}
.tb .ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pl);padding:0 10px;font:600 14px var(--f-u);letter-spacing:.01em;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.win:not(.act) .tb .ttl{color:#888;background:#d4d4d4}
.tb .ttl svg{width:14px;height:14px}
.bx{width:13px;height:13px;border:1px solid #000;background:linear-gradient(135deg,#fff,#c0c0c0);box-shadow:inset 1px 1px 0 #fff;flex:none;position:relative;z-index:2}
.bx:active{background:#888}
.win:not(.act) .bx{border-color:#999;background:#d4d4d4;box-shadow:none}
.bx.z{margin-left:auto}.bx.z::after{content:'';position:absolute;left:2px;top:2px;width:5px;height:5px;border:1px solid #000}.bx.s::after{content:'';position:absolute;left:1px;right:1px;top:5px;height:1px;background:#000}
.body{flex:1;margin:0 2px 2px;background:#fff;border:1px solid #777;border-top:0;overflow:auto;position:relative;min-height:0}
.win.shade{min-height:0!important;height:auto!important}.win.shade .body,.win.shade .grow{display:none}
.grow{position:absolute;right:0;bottom:0;width:15px;height:15px;cursor:nwse-resize;z-index:5;background:linear-gradient(135deg,transparent 50%,#888 50% 58%,transparent 58% 66%,#888 66% 74%,transparent 74%)}
.body::-webkit-scrollbar{width:15px;height:15px}.body::-webkit-scrollbar-track{background:repeating-linear-gradient(45deg,#e8e8e8 0 2px,#d8d8d8 2px 4px);border-left:1px solid #777}
.body::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#f4f4f4,#bbb);border:1px solid #444;border-radius:2px}
.status{flex:none;margin:0 2px 2px;height:20px;padding:0 8px;border:1px solid #777;border-top:0;background:var(--pl);font:500 11.5px/18px var(--f-b);display:flex;justify-content:space-between;color:#333}
.btn{display:inline-block;font:600 13px var(--f-b);color:#000;padding:4px 18px;border:1px solid #000;border-radius:7px;background:linear-gradient(#fff,#d4d4d4 50%,#bdbdbd);box-shadow:inset 0 0 0 1px #fff,1px 1px 0 rgba(0,0,0,.4);text-decoration:none;cursor:default}
.btn:active{background:linear-gradient(#aaa,#ccc)}.btn.def{box-shadow:0 0 0 2px #000,inset 0 0 0 1px #fff}
h1,h2,h3{font-family:var(--f-u);margin:0}

/* about */
.doc{padding:20px 24px 28px;font:400 14px/1.65 var(--f-b);-webkit-user-select:text;user-select:text}
.doc .hdr{display:flex;gap:16px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid #000}
.doc .pic{width:84px;height:100px;border:2px solid #000;background:linear-gradient(180deg,#9bb8f0,#d9e6ff);display:grid;place-items:end center;overflow:hidden;box-shadow:3px 3px 0 #000}
.doc .pic img{width:58px;image-rendering:pixelated;margin-bottom:-2px}
.doc h1{font-size:30px;line-height:1}.doc .sub{font:500 14px var(--f-b);color:#444;margin-top:4px}
.doc p{margin:0 0 12px}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.tbl td{border:1px solid #888;padding:5px 10px}.tbl td:first-child{background:#e8e8e8;font-weight:600;width:34%}
.bars{margin-top:16px;display:grid;gap:8px}.bar{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:10px;font-size:12.5px}
.bar .tr{height:14px;border:1px solid #000;background:#fff;box-shadow:inset 1px 1px 0 #aaa}.bar .fl{height:100%;background:repeating-linear-gradient(90deg,#3a3a9a 0 5px,#5a5ac0 5px 7px)}.bar b{text-align:right}

/* extensions manager */
.em{display:flex;flex-direction:column;height:100%}
.em .tabs{display:flex;gap:2px;padding:10px 12px 0;background:var(--pl);border-bottom:1px solid #000;flex-wrap:wrap}
.em .tab{padding:5px 14px;border:1px solid #000;border-bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(#e8e8e8,#bbb);font:600 12.5px var(--f-b);position:relative;top:1px}
.em .tab.on{background:#fff;font-weight:600}
.em .list{flex:1;overflow:auto;background:#fff}
.em .hd,.em .row{display:grid;grid-template-columns:34px 1fr 140px 80px;align-items:center}
.em .hd{background:linear-gradient(#f4f4f4,#cfcfcf);border-bottom:1px solid #000;font:600 12px var(--f-b);position:sticky;top:0;z-index:2}.em .hd span{padding:3px 8px;border-right:1px solid #888}
.em .row{border-bottom:1px solid #e0e0e0;font-size:13px}.em .row:nth-child(odd){background:#f3f3fb}.em .row:hover{background:#d5d5f0}
.em .row span{padding:3px 8px}
.ckb{width:14px;height:14px;border:1px solid #000;background:#fff;margin:auto;position:relative;box-shadow:inset 1px 1px 0 #aaa}.ckb.on::after{content:'✕';position:absolute;inset:-3px 0 0 1px;font:700 13px/18px var(--f-b)}
.em .row .ext{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;vertical-align:middle;border:1px solid #000;font:700 8px var(--f-u);background:var(--c);color:#000}

/* finder list */
.fl{font-size:13px}
.fl .hd,.fl .r{display:grid;grid-template-columns:2.2fr 1.8fr 1.5fr 1.2fr;align-items:center}
.fl .hd{background:linear-gradient(#f4f4f4,#cfcfcf);border-bottom:1px solid #000;font:600 12px var(--f-b);position:sticky;top:0;z-index:2}.fl .hd span{padding:3px 10px;border-right:1px solid #888}
.fl .r{border-bottom:1px solid #eee;cursor:default}.fl .r>span{padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .r:nth-child(4n+3){background:#f3f3fb}
.fl .r.sel{background:var(--sel)!important;color:#fff}
.fl .tri{display:inline-block;width:12px;margin-right:6px;font-size:10px;transition:transform .15s}.fl .r.open .tri{transform:rotate(90deg)}
.fl .r svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.fl .sub{display:none;padding:10px 20px 16px 44px;background:#fff;border-bottom:1px solid #ccc;font-size:13px;line-height:1.55;-webkit-user-select:text;user-select:text}
.fl .r.open+.sub{display:block}
.sub ul{margin:6px 0 0;padding-left:18px}.sub li{margin-bottom:6px}.sub .meta{font:600 12px var(--f-b);color:#555}.sub strong{background:#ffef9a}

/* browser */
.br{display:flex;flex-direction:column;height:100%}
.br .tool{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--pl);border-bottom:1px solid #000;flex:none}
.br .tb2{padding:3px 12px;border:1px solid #000;border-radius:6px;background:linear-gradient(#fff,#c8c8c8);font:600 12px var(--f-b)}
.br .loc{flex:1;border:1px solid #000;background:#fff;padding:3px 8px;font:500 12.5px var(--f-b);box-shadow:inset 1px 1px 0 #aaa}
.br .page{flex:1;overflow:auto;background:#fff;-webkit-user-select:text;user-select:text}
.br .hero{padding:26px 28px 14px;background:linear-gradient(135deg,#e0e0ff,#f6f0ff)}.br .hero h2{font-size:34px}.br .hero p{margin:4px 0 0;color:#444}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 28px 30px}
.card{border:2px solid #000;background:#fff;box-shadow:4px 4px 0 #000;display:flex;flex-direction:column}
.card .ph{height:130px;border-bottom:2px solid #000;overflow:hidden;background:#222;position:relative}.card .ph img{width:100%;height:100%;object-fit:cover;object-position:top}.card .ph svg{width:100%;height:100%;display:block}
.card .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{font-size:20px;line-height:1.1}.card .rl{font:600 12px var(--f-b);color:#555}.card p{margin:0;font-size:13px}
.card ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.45}.card li{margin-bottom:3px}.card strong{background:#ffef9a}
.card .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}.card .tg span{font:600 11px var(--f-b);border:1px solid #000;padding:0 7px;background:#e8e8f8}
.award{position:absolute;right:6px;top:6px;background:#ffe14a;border:2px solid #000;padding:1px 8px;font:700 11px var(--f-u);transform:rotate(4deg)}
.br .side-h{padding:0 28px;font:700 20px var(--f-u)}

/* stickies */
.stk{display:flex;gap:18px;padding:18px;flex-wrap:wrap;background:#bcc2e0;min-height:100%}
.note{flex:1;min-width:280px;background:var(--n,#fff59a);border:1px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;position:relative}
.note .nb{height:14px;background:var(--nb,#e8d84a);border-bottom:1px solid #000}
.note .nt{padding:14px 16px 18px;font:500 13.5px/1.55 var(--f-b);-webkit-user-select:text;user-select:text}
.note h3{font-size:22px;line-height:1.1}.note .rl{font-weight:600;margin:2px 0 8px}.note .st{display:flex;align-items:baseline;gap:10px;margin:8px 0}.note .st b{font:700 40px/1 var(--f-u)}.note .st span{font:600 12px var(--f-b);text-transform:uppercase}
.note ul{margin:6px 0 0;padding-left:18px}.note li{margin-bottom:6px}.note strong{background:rgba(255,255,255,.7)}

/* mail */
.ml{display:flex;flex-direction:column;height:100%;background:var(--pl)}
.ml .hdrs{padding:10px 12px;border-bottom:1px solid #000;display:grid;gap:6px;font-size:13px}
.ml .hdrs label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-weight:600}
.ml input,.ml textarea{font:500 13.5px var(--f-b);border:1px solid #000;background:#fff;padding:4px 8px;box-shadow:inset 1px 1px 0 #aaa;outline:0;width:100%;-webkit-user-select:text;user-select:text}
.ml input:focus,.ml textarea:focus{box-shadow:inset 1px 1px 0 #aaa,0 0 0 2px #7a7aff}
.ml textarea{flex:1;resize:none;border-top:0;min-height:120px}
.ml .bot{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #000;flex:none}.ml .msg{font-weight:600;color:#a02a2a;font-size:12.5px}
.hp{position:absolute;left:-9999px}
.ab{display:grid;gap:8px;padding:14px}.ab a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#000;padding:8px 10px;border:1px solid #bbb;background:#fafafa}.ab a:hover{background:var(--sel);color:#fff}.ab a b{display:block}.ab a small{display:block;opacity:.75}.ab svg{width:30px;height:30px;flex:none}

/* dialogs */
#dl{position:fixed;inset:0;z-index:9500;display:none;place-items:center;background:rgba(0,0,0,.2)}
#dl.on{display:grid}
.dlg{width:min(420px,92vw);background:var(--pl);border:2px solid #000;box-shadow:inset 1px 1px 0 #fff,6px 7px 0 rgba(0,0,0,.45);padding:16px 18px 16px;display:grid;grid-template-columns:56px 1fr;gap:14px}
.dlg svg{width:48px;height:48px}.dlg p{margin:0 0 4px;font-weight:600}.dlg .sm{font-weight:400;color:#333}
.dlg .bt{grid-column:1/3;display:flex;justify-content:flex-end;gap:12px;margin-top:6px}

/* dock */
#dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9000;display:flex;gap:6px;padding:6px 10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(210,210,230,.55));border:1px solid rgba(0,0,0,.6);border-radius:14px 14px 4px 4px;backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 #fff;max-width:96vw;overflow-x:auto}
#dock button{width:46px;height:46px;position:relative;display:grid;place-items:center;transition:transform .12s;flex:none}
#dock button:hover{transform:translateY(-8px) scale(1.25)}
#dock svg{width:40px;height:40px}
#dock button.run::after{content:'';position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:#222}
#dock .tip{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font:500 11px var(--f-b);padding:2px 8px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none}
#dock button:hover .tip{opacity:1}

/* boot */
#boot{position:fixed;inset:0;z-index:99999;background:#000;display:grid;place-items:center;color:#fff;transition:opacity .6s,visibility .6s}
#boot.off{opacity:0;visibility:hidden;pointer-events:none}
#boot .in{text-align:center}#boot svg{width:84px;height:84px;image-rendering:pixelated}
#boot h2{font:700 24px var(--f-u);margin:16px 0 4px;letter-spacing:.02em}#boot p{margin:0 0 18px;font:500 13px var(--f-b);opacity:.8}
#boot .pb{width:260px;height:14px;border:1px solid #fff;margin:0 auto;padding:2px}#boot .pb i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#fff 0 6px,#000 6px 8px);animation:ld 2.2s steps(22) forwards}
@keyframes ld{to{width:100%}}

@media(max-width:760px){
  .win{left:0!important;top:24px!important;width:100vw!important;height:calc(100vh - 24px - 66px)!important;min-width:0}.grow{display:none}
  #ic{bottom:80px;right:6px}.ico{width:74px}.ico span{font-size:11px}#mb .usr{display:none}#mb .m>button{padding:0 9px}
  .fl .hd,.fl .r{grid-template-columns:2fr 1.4fr 1fr}.fl .hd span:nth-child(3),.fl .r>span:nth-child(3){display:none}.bar{grid-template-columns:100px 1fr 54px}
  .em .hd,.em .row{grid-template-columns:30px 1fr 100px}.em .hd span:nth-child(4),.em .row span:nth-child(4){display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mb" role="menubar">
  <div class="m" data-m="ap"><button><span class="logo" style="display:inline-block;vertical-align:middle;margin:0"></span></button><div class="dd" id="dd-ap"></div></div>
  <div class="m" data-m="file"><button>File</button><div class="dd" id="dd-file"></div></div>
  <div class="m" data-m="edit"><button>Edit</button><div class="dd" id="dd-edit"></div></div>
  <div class="m" data-m="view"><button>View</button><div class="dd" id="dd-view"></div></div>
  <div class="m" data-m="sp"><button>Special</button><div class="dd" id="dd-sp"></div></div>
  <div class="sp"></div><div class="ck" id="ck"></div><div class="usr"><i></i>Lan Anh</div>
</div>
<div id="ic"></div>
<div id="wins"></div>
<div id="dock" aria-label="Launcher"></div>
<div id="dl"><div class="dlg" id="dlg"></div></div>
<div id="boot"><div class="in"><svg viewBox="0 0 32 32" shape-rendering="crispEdges"><rect x="4" y="2" width="24" height="26" fill="#000"/><rect x="5" y="3" width="22" height="24" fill="#e8e8e8"/><rect x="8" y="6" width="16" height="12" fill="#222"/><rect x="9" y="7" width="14" height="10" fill="#8ab8d8"/><rect x="11" y="9" width="2" height="3" fill="#000"/><rect x="19" y="9" width="2" height="3" fill="#000"/><rect x="12" y="14" width="8" height="1" fill="#000"/><rect x="11" y="13" width="1" height="1" fill="#000"/><rect x="20" y="13" width="1" height="1" fill="#000"/><rect x="9" y="21" width="9" height="2" fill="#555"/><rect x="21" y="21" width="3" height="3" fill="#e03a3a"/></svg><h2>Welcome to Lan Anh OS</h2><p>Starting up…  extensions loading</p><div class="pb"><i></i></div></div></div>

<script src="/shared/data.js"></script>
<script src="/shared/content.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = (s,c=document) => [...c.querySelectorAll(s)];
const D = window.PORTFOLIO, C = window.C, esc = C.esc, fmt = C.fmt;
const mobile = () => innerWidth<=760;

/* ---------- icons (SVG, platinum style) ---------- */
const O = '#000';
const IC = {
  folder:`<svg viewBox="0 0 48 48"><path d="M4 12h14l4 4h22v26H4Z" fill="#8aa0d8" stroke="${O}" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 18h40v24H4Z" fill="#b8c8f0" stroke="${O}" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 20h36" stroke="#fff" stroke-width="2"/></svg>`,
  doc:`<svg viewBox="0 0 48 48"><path d="M10 4h20l8 8v32H10Z" fill="#fff" stroke="${O}" stroke-width="1.6" stroke-linejoin="round"/><path d="M30 4v8h8" fill="#ddd" stroke="${O}" stroke-width="1.6"/><path d="M15 20h18M15 26h18M15 32h12" stroke="#7a7acc" stroke-width="2.2"/></svg>`,
  pdf:`<svg viewBox="0 0 48 48"><path d="M10 4h20l8 8v32H10Z" fill="#fff" stroke="${O}" stroke-width="1.6" stroke-linejoin="round"/><path d="M30 4v8h8" fill="#ddd" stroke="${O}" stroke-width="1.6"/><rect x="13" y="22" width="22" height="12" fill="#d8362a" stroke="${O}" stroke-width="1.2"/><text x="24" y="31.5" text-anchor="middle" font-family="Arial" font-weight="800" font-size="9" fill="#fff">PDF</text></svg>`,

/* ---------- window manager ---------- */
function focusWin(id){ Object.entries(wins).forEach(([k,w]) => w.el.classList.toggle('act',k===id)); if (wins[id]){ wins[id].el.style.zIndex = ++zTop; } $$('#dock button').forEach(b => b.classList.toggle('run',!!wins[b.dataset.id])); }
function closeWin(id){ const w = wins[id]; if (!w) return; w.el.remove(); delete wins[id]; const ids = Object.keys(wins); if (ids.length) focusWin(ids[ids.length-1]); else $$('#dock button').forEach(b => b.classList.remove('run')); }
function openWin(id){
  if (wins[id]){ wins[id].el.classList.remove('shade'); focusWin(id); return; }
  const def = WIN[id]; if (!def) return;
  const n = Object.keys(wins).length;
  const el = document.createElement('div'); el.className = 'win'; el.dataset.id = id;
  const W = Math.min(def.w,innerWidth-40), H = Math.min(def.h,innerHeight-120);
  el.style.cssText = `left:${clamp(def.x??(70+n*34),8,Math.max(8,innerWidth-W-120))}px;top:${clamp(def.y??(50+n*30),30,Math.max(30,innerHeight-H-70))}px;width:${W}px;height:${H}px`;
  el.innerHTML = `<div class="tb"><span class="bx" data-a="close" aria-label="Close"></span><span class="ttl">${IC[def.icon]||''}${esc(def.title)}</span><span class="bx z" data-a="zoom" aria-label="Zoom"></span><span class="bx s" data-a="shade" aria-label="Collapse"></span></div><div class="body"></div>${def.status?`<div class="status"><span>${def.status}</span><span>Lan Anh HD</span></div>`:''}<span class="grow"></span>`;
  $('#wins').appendChild(el); wins[id] = { el, def };
  def.render(el.querySelector('.body'));
  el.addEventListener('pointerdown',() => focusWin(id));
  const tb = el.querySelector('.tb'); let sx,sy,ox,oy,on = false;
  tb.addEventListener('pointerdown',e => { if (e.target.closest('.bx')||mobile()) return; on = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; tb.setPointerCapture(e.pointerId); });
  tb.addEventListener('pointermove',e => { if (!on) return; el.style.left = clamp(ox+e.clientX-sx,-el.offsetWidth+80,innerWidth-60)+'px'; el.style.top = clamp(oy+e.clientY-sy,24,innerHeight-30)+'px'; });
  tb.addEventListener('pointerup',() => on = false);
  tb.addEventListener('dblclick',e => { if (!e.target.closest('.bx')) el.classList.toggle('shade'); });
  el.querySelector('[data-a=close]').addEventListener('click',() => closeWin(id));
  el.querySelector('[data-a=shade]').addEventListener('click',() => el.classList.toggle('shade'));
  el.querySelector('[data-a=zoom]').addEventListener('click',() => { if (el._z){ el.style.cssText = el._z; el._z = null; } else { el._z = el.style.cssText; el.style.left = '6px'; el.style.top = '30px'; el.style.width = innerWidth-12-100+'px'; el.style.height = innerHeight-130+'px'; } });
  const gr = el.querySelector('.grow'); let rw,rh,rx,ry,rn = false;
  gr.addEventListener('pointerdown',e => { rn = true; rx = e.clientX; ry = e.clientY; rw = el.offsetWidth; rh = el.offsetHeight; gr.setPointerCapture(e.pointerId); e.stopPropagation(); });
  gr.addEventListener('pointermove',e => { if (!rn) return; el.style.width = Math.max(280,rw+e.clientX-rx)+'px'; el.style.height = Math.max(140,rh+e.clientY-ry)+'px'; });
  gr.addEventListener('pointerup',() => rn = false);
  focusWin(id);
}

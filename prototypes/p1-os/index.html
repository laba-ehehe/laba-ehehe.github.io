<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lan Anh OS · Prototype 1</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/content.css">
<style>
:root{
  --p1:#ff8fc7; --p2:#c9b6ff; --p3:#8fe8ff; --ink:#3a2a55; --mute:#8a78a8;
  --c-ink:#3a2a55; --c-mute:#8a78a8; --c-accent:#e0489a; --c-line:#e6d8fb; --c-card:#fff; --c-input:#fff;
  --c-chip-a:#ffd9ee; --c-chip-b:#d9ecff; --c-chip-c:#fff2b8; --c-chip-d:#d8f7e6; --c-chip-e:#eadcff;
  --c-font-h:'Pixelify Sans',monospace; --c-font-b:'Nunito',sans-serif; --c-btn:#ff8fc7; --c-btn-ink:#3a1a4a; --c-radius:14px; --c-bullet:'♡';
}
*{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Nunito',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
/* wallpaper */
#desktop{position:fixed;inset:0 0 52px 0;overflow:hidden;
  background:
   radial-gradient(900px 600px at 15% 10%,rgba(255,255,255,.85),transparent 60%),
   radial-gradient(700px 520px at 90% 20%,rgba(143,232,255,.7),transparent 60%),
   radial-gradient(800px 600px at 70% 100%,rgba(255,143,199,.65),transparent 60%),
   linear-gradient(135deg,#ffd6ec,#e4d4ff 45%,#cdeeff);
  transition:background .6s}
#desktop::before{content:'';position:absolute;inset:0;background:
   linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px) 0 0/44px 44px,
   linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px) 0 0/44px 44px;mask-image:linear-gradient(#000,transparent 85%)}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0,rgba(255,255,255,.55) 18%,rgba(190,225,255,.25) 55%,rgba(255,200,240,.35));border:1px solid rgba(255,255,255,.7);animation:rise linear infinite;pointer-events:none}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-130vh)}}
.mark{position:absolute;right:28px;bottom:18px;font:700 clamp(40px,8vw,110px)/.9 'Pixelify Sans';letter-spacing:-.02em;text-align:right;pointer-events:none;
  background:linear-gradient(90deg,#ff8fc7,#c9b6ff,#8fe8ff,#ff8fc7);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.55;animation:slide 8s linear infinite}
@keyframes slide{to{background-position:200%}}
body.night #desktop{background:
   radial-gradient(800px 520px at 20% 0,rgba(150,110,255,.5),transparent 60%),
   radial-gradient(700px 520px at 90% 90%,rgba(255,110,190,.35),transparent 60%),linear-gradient(160deg,#241846,#1a1236 60%,#2a1450)}
body.night #desktop::before{background:radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 12%,#fff,transparent),radial-gradient(2px 2px at 85% 30%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 35% 55%,#fff,transparent),radial-gradient(2px 2px at 75% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#ffe9a8,transparent);mask-image:none}
body.night .mark{opacity:.35}
/* icons */
#icons{position:absolute;left:18px;top:14px;height:calc(100% - 28px);display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px 6px;z-index:1}
.icon{width:92px;background:none;border:0;padding:6px 4px;border-radius:12px;text-align:center;color:#3a2a55}
.icon:hover,.icon:focus-visible{background:rgba(255,255,255,.45);outline:none}
.ico{width:60px;height:60px;margin:0 auto 4px;border-radius:18px;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(160deg,#fff,#ffd6ec 45%,#c9b6ff);box-shadow:inset 0 2px 0 #fff,0 8px 16px rgba(120,80,170,.28);transition:transform .2s}
.icon:hover .ico{transform:translateY(-3px) rotate(-4deg)}
.icon span{display:block;font:700 12px 'Nunito';text-shadow:0 1px 0 rgba(255,255,255,.9);line-height:1.15}
body.night .icon{color:#fff} body.night .icon span{text-shadow:0 1px 4px rgba(0,0,0,.6)}
/* windows */
.win{position:absolute;display:flex;flex-direction:column;border-radius:18px 18px 12px 12px;background:#fff;border:2px solid #fff;
  box-shadow:0 0 0 1.5px #b79ad6,0 18px 44px rgba(90,50,150,.35);overflow:hidden;resize:both;min-width:280px;min-height:180px;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.win.hidden{display:none}
.tb{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;cursor:grab;touch-action:none;
  background:linear-gradient(180deg,#ffd0ec,#e7c9ff 55%,#c6b4ff);border-bottom:2px solid #b79ad6}
.tb::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.05))}
.tb:active{cursor:grabbing}
.tt{position:relative;font:600 15px 'Pixelify Sans';letter-spacing:.02em;color:#3a1f5a;text-shadow:0 1px 0 rgba(255,255,255,.7);display:flex;gap:6px;align-items:center}
.tbtn{position:relative;display:flex;gap:6px}
.tbtn button{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(60,30,90,.45);padding:0;font:800 11px/1 'Nunito';color:#3a1f5a;
  background:radial-gradient(circle at 35% 30%,#fff,#ffe9a8 50%,#ffc94d);box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.tbtn .max{background:radial-gradient(circle at 35% 30%,#fff,#c8f7dc 50%,#5fdc98)} .tbtn .cls{background:radial-gradient(circle at 35% 30%,#fff,#ffc8e0 50%,#ff6aa8)}
.win-body{flex:1;overflow:auto;padding:18px 20px 24px;user-select:text;-webkit-user-select:text;font-size:15px;line-height:1.55;background:linear-gradient(#fff,#fff7fc)}
.win-body::-webkit-scrollbar{width:14px}.win-body::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#ffc2e3,#c9b6ff);border-radius:10px;border:3px solid #fff}
.welcome{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.sprite{position:relative;width:176px;padding:26px 10px 12px;border-radius:26px;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fff 0,#ffe3f3 38%,#e4d9ff 100%);box-shadow:inset 0 2px 0 #fff,inset 0 0 0 3px rgba(255,255,255,.7),0 8px 18px rgba(120,80,170,.28)}
.sprite::before{content:'✦  ✧  ✦';position:absolute;top:8px;left:0;right:0;font-size:12px;letter-spacing:.5em;color:#fff;text-shadow:0 0 6px #c9b6ff,0 0 2px #b79ad6;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.sprite img{width:120px;height:176px;image-rendering:pixelated;display:block;margin:4px auto 0;filter:drop-shadow(0 4px 0 rgba(120,80,170,.25));animation:idle 1.3s steps(1) infinite}
@keyframes idle{50%{transform:translateY(-4px)}}
.sprite b{display:block;margin-top:10px;font:600 13px 'Pixelify Sans';color:#6d4a9a;letter-spacing:.04em}
.welcome h1{margin:0;font:700 34px/1 'Pixelify Sans'} .welcome p{margin:6px 0}
@media(max-width:560px){.welcome{grid-template-columns:1fr;text-align:center}.sprite{margin:auto}}
/* pixel desktop pet */
#pet{position:absolute;left:0;bottom:0;z-index:60;width:62px;height:90px;padding:0;border:0;background:none;cursor:grab;touch-action:none;will-change:transform;transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
#pet:active{cursor:grabbing}
#pet .fl{display:block;width:60px;height:88px}
#pet .spr{display:block;width:60px;height:88px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(70,30,120,.28));transform-origin:50% 100%}
#pet .shadow{position:absolute;left:6px;right:6px;bottom:-3px;height:8px;border-radius:50%;background:rgba(70,30,120,.22);z-index:-1}
#pet.idle .spr{animation:breath 2.2s steps(1) infinite}
#pet.walk .spr{animation:step .38s steps(1) infinite}
#pet.hop .spr{animation:hop .72s cubic-bezier(.3,.9,.4,1)}
@keyframes breath{50%{transform:scaleY(1.03)}}
@keyframes step{50%{transform:translateY(-4px) rotate(2.5deg)}}
@keyframes hop{0%{transform:scale(1.05,.9)}35%{transform:translateY(-46px) scale(.96,1.06)}70%{transform:translateY(0) scale(1.07,.9)}100%{transform:none}}
#say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px;width:max-content;max-width:210px;padding:9px 13px;border-radius:16px;background:#fff;border:2px solid #d9c3f5;font:700 13px/1.35 'Nunito';color:#3a2a55;text-align:left;box-shadow:0 8px 20px rgba(120,80,170,.2);opacity:0;pointer-events:none;transition:opacity .25s;white-space:normal}
#say.on{opacity:1}
#say::after{content:'';position:absolute;left:50%;top:100%;width:10px;height:10px;background:#fff;border-right:2px solid #d9c3f5;border-bottom:2px solid #d9c3f5;transform:translate(-50%,-6px) rotate(45deg)}
.spk{position:absolute;z-index:61;color:#ff8fc7;font-size:16px;pointer-events:none;text-shadow:0 0 6px #fff;animation:spk .9s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx,0),-42px)}}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:100;
  background:linear-gradient(180deg,#ffe3f3,#ffbfe0 50%,#e7b6ff);border-top:2px solid #fff;box-shadow:0 -6px 20px rgba(120,80,170,.25)}
#start{height:36px;padding:0 18px;border-radius:999px;border:2px solid #fff;font:700 15px 'Pixelify Sans';color:#3a1a4a;
  background:linear-gradient(180deg,#fff,#ffc2e3 55%,#ff8fc7);box-shadow:0 3px 8px rgba(190,60,140,.35)}
#start:hover{filter:brightness(1.05)}
#tasks{display:flex;gap:6px;flex:1;overflow:hidden}
.task{height:34px;padding:0 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5);font:700 13px 'Nunito';white-space:nowrap}
.task.on{background:#fff;box-shadow:inset 0 -3px 0 #ff8fc7}
#tray{display:flex;gap:10px;align-items:center;padding:0 12px;height:34px;border-radius:10px;background:rgba(255,255,255,.55);font:600 14px 'Pixelify Sans'}
#startmenu{position:fixed;left:10px;bottom:60px;width:260px;z-index:101;border-radius:18px;border:2px solid #fff;overflow:hidden;
  background:rgba(255,255,255,.96);box-shadow:0 0 0 1.5px #b79ad6,0 18px 44px rgba(90,50,150,.4);animation:pop .2s}
#startmenu[hidden]{display:none}
#startmenu header{padding:12px 14px;background:linear-gradient(180deg,#ffd0ec,#c6b4ff);font:700 16px 'Pixelify Sans';color:#3a1f5a;display:flex;gap:10px;align-items:center}
#startmenu header img{width:34px;height:34px;border-radius:50%;border:2px solid #fff;object-fit:cover;object-position:50% 6%;image-rendering:pixelated;background:#ffd6ec}
#startmenu button,#startmenu a{display:flex;gap:10px;align-items:center;width:100%;padding:9px 16px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);font:700 14px 'Nunito'}
#startmenu button:hover,#startmenu a:hover{background:#ffe3f3}
#startmenu hr{border:0;border-top:1.5px dashed #e6d8fb;margin:4px 0}
/* boot */
#boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:linear-gradient(160deg,#ffd6ec,#e4d4ff,#cdeeff);transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.bootbox{width:min(420px,88vw);text-align:center}
.bootspr{width:90px;height:132px;image-rendering:pixelated;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 0 rgba(120,80,170,.25));animation:bootb .6s steps(1) infinite}@keyframes bootb{50%{transform:translateY(-6px)}}
.bootbox h1{font:700 44px 'Pixelify Sans';margin:6px 0;background:linear-gradient(90deg,#ff5fb0,#8a6dff,#2fc7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bootbox p{margin:0 0 18px;font:600 14px 'Pixelify Sans';color:#6d5a90}
.bar{height:26px;border-radius:999px;border:2.5px solid #fff;background:rgba(255,255,255,.55);padding:3px;box-shadow:inset 0 2px 5px rgba(120,80,170,.2)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:repeating-linear-gradient(90deg,#ff8fc7 0 14px,#c9b6ff 14px 28px);transition:width .1s}
.bootbox small{display:block;margin-top:14px;color:#8a78a8}
/* mobile */
@media(max-width:700px){
  #icons{flex-direction:row;height:auto;left:8px;right:8px;top:8px;gap:4px}
  .icon{width:auto} .win{left:6px!important;top:6px!important;width:calc(100vw - 12px)!important;height:calc(100dvh - 70px)!important;resize:none}
  .tb{cursor:default}
}
</style>
</head>
<body>
<div id="boot"><div class="bootbox"><img class="bootspr" src="/assets/img/avatar-px.png" alt="Pixel avatar of Lan Anh"><h1>Lan Anh OS</h1><p>version 2026 · cyber-kawaii edition</p><div class="bar"><i id="fill"></i></div><small id="bmsg">loading sparkles…</small></div></div>

<div id="desktop">
  <div id="icons"></div>
  <div class="mark" aria-hidden="true">lan anh<br>os ✦</div>
  <button id="pet" class="idle" aria-label="Pixel buddy: click for a tip, or pick her up"><span class="fl"><img class="spr" src="/assets/img/avatar-px.png" alt=""></span><span class="shadow"></span><span id="say" role="status"></span></button>
</div>

<div id="startmenu" hidden>
  <header><img src="/assets/img/avatar-px.png" alt="">Lan Anh Do</header>
  <div id="smitems"></div><hr>
  <a href="/assets/Lan-Anh-Do-Resume.pdf" download="Lan-Anh-Do-Resume.pdf">📄 Download resume</a>
  <button id="nightbtn">🌙 Night wallpaper</button>
  <button id="restart">🔁 Restart</button>
</div>
<div id="taskbar"><button id="start">✿ start</button><div id="tasks"></div><div id="tray"><span>🔊</span><span id="clock"></span></div></div>

<script src="/shared/data.js"></script>
<script src="/shared/content.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const ICONS = { profile: ['🪪', 'About Me'], skills: ['🎨', 'Skills'], experience: ['💼', 'Experience'], projects: ['🎮', 'Projects'], leadership: ['👑', 'Leadership'], contact: ['💌', 'Contact'] };
  const mobile = () => matchMedia('(max-width:700px)').matches;
  let z = 10, wins = {}, order = 0;

  /* bubbles */
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div'), s = 24 + Math.random() * 90;
    b.className = 'bubble'; b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${100 + Math.random() * 30}vh;animation-duration:${18 + Math.random() * 24}s;animation-delay:${-Math.random() * 30}s`;
    $('#desktop').appendChild(b);
  }

  /* icons + start menu */
  $('#icons').innerHTML = Object.entries(ICONS).map(([id, [e, t]]) => `<button class="icon" data-open="${id}"><div class="ico">${e}</div><span>${t}</span></button>`).join('')
    + `<a class="icon" href="/assets/Lan-Anh-Do-Resume.pdf" download="Lan-Anh-Do-Resume.pdf" style="text-decoration:none"><div class="ico">📄</div><span>resume.pdf</span></a>`;
  $('#smitems').innerHTML = Object.entries(ICONS).map(([id, [e, t]]) => `<button data-open="${id}">${e} ${t}</button>`).join('');

  /* windows */
  function open(id, html, title, emoji, w = 620, h = 520) {
    if (wins[id]) { show(id); return; }
    const el = document.createElement('section'); el.className = 'win';
    const k = order++ % 6, W = Math.min(w, innerWidth - 24), H = Math.min(h, innerHeight - 110);
    el.style.cssText = `left:${Math.max(8, 150 + k * 34 + Math.random() * 40)}px;top:${24 + k * 30}px;width:${W}px;height:${H}px;z-index:${++z}`;
    el.innerHTML = `<div class="tb"><span class="tt">${emoji} ${title}</span><span class="tbtn"><button class="min" aria-label="Minimize">_</button><button class="max" aria-label="Maximize">▢</button><button class="cls" aria-label="Close">✕</button></span></div><div class="win-body">${html}</div>`;
    $('#desktop').appendChild(el);
    C.wire(el);
    const task = document.createElement('button'); task.className = 'task on'; task.textContent = emoji + ' ' + title;
    $('#tasks').appendChild(task);
    wins[id] = { el, task };
    el.addEventListener('pointerdown', () => focus(id));
    task.addEventListener('click', () => { const h = el.classList.contains('hidden') || task.dataset.top !== '1'; h ? show(id) : hide(id); });
    $('.min', el).onclick = () => hide(id);
    $('.cls', el).onclick = () => { el.remove(); task.remove(); delete wins[id]; };
    $('.max', el).onclick = () => { const m = el.dataset.m === '1'; if (!m) { el.dataset.prev = el.style.cssText; el.style.cssText = `left:0;top:0;width:100%;height:100%;z-index:${++z}`; el.dataset.m = '1'; } else { el.style.cssText = el.dataset.prev; el.dataset.m = '0'; } };
    drag(el, $('.tb', el));
    focus(id);
  }
  function focus(id) { const w = wins[id]; w.el.style.zIndex = ++z; Object.values(wins).forEach(x => { x.task.classList.remove('on'); x.task.dataset.top = '0'; }); w.task.classList.add('on'); w.task.dataset.top = '1'; }
  function show(id) { wins[id].el.classList.remove('hidden'); focus(id); }
  function hide(id) { wins[id].el.classList.add('hidden'); wins[id].task.classList.remove('on'); wins[id].task.dataset.top = '0'; }
  function drag(el, bar) {
    let sx, sy, ox, oy, on = false;
    bar.addEventListener('pointerdown', e => { if (e.target.closest('button') || mobile() || el.dataset.m === '1') return; on = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; bar.setPointerCapture(e.pointerId); });
    bar.addEventListener('pointermove', e => { if (!on) return; el.style.left = Math.max(-el.offsetWidth + 80, Math.min(innerWidth - 80, ox + e.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 120, oy + e.clientY - sy)) + 'px'; });
    bar.addEventListener('pointerup', () => { on = false; });
  }
  const openModule = id => { const [e, t] = ICONS[id]; open(id, C.get(id), t + '.exe', e, id === 'projects' ? 760 : 620, id === 'contact' ? 560 : 540); };
  document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (!o) return; if (o.classList.contains('icon') && !mobile() && e.detail < 2) { $$('.icon').forEach(i => i.classList.remove('sel')); say('double-click to open ✿'); return; } openModule(o.dataset.open); $('#startmenu').hidden = true; });
  const $$ = s => [...document.querySelectorAll(s)];

  /* welcome window */
  function welcome() {
    open('welcome', `<div class="welcome"><div class="sprite"><img src="/assets/img/avatar-px.png" alt="Lan Anh Do, pixel avatar"><b>player 1 · Lan Anh</b></div><div><h1>Lan Anh Do</h1><p><b>Software Engineer · Product Builder</b></p><p>CompE + Econ @ University of Florida. I build AI tools, full-stack apps and robots, and I lead product communities.</p><p class="c-row"><button class="c-btn" data-open="experience">see experience</button><button class="c-btn" data-open="projects" style="background:#c9b6ff">see projects</button></p></div></div>`, 'Welcome.txt', '🌸', 560, 330);
  }

  /* start menu, clock, night, mochi tips */
  $('#start').onclick = e => { e.stopPropagation(); $('#startmenu').hidden = !$('#startmenu').hidden; };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#startmenu,#start')) $('#startmenu').hidden = true; });
  $('#nightbtn').onclick = () => { document.body.classList.toggle('night'); $('#nightbtn').textContent = document.body.classList.contains('night') ? '☀ Day wallpaper' : '🌙 Night wallpaper'; };
  const fc = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
  const tick = () => { $('#clock').textContent = fc.format(new Date()); }; tick(); setInterval(tick, 15000);
  /* pixel desktop pet: walks, hops, flips, can be picked up and dropped */
  const tips = ["hi! i'm player 1 ✿", 'double-click an icon to open it', 'drag windows by their title bar!', 'drag a window corner to resize ✦', 'psst… resume.pdf is on the desktop', 'try the night wallpaper in the start menu 🌙', 'pick me up and drop me!', 'press start to see everything ♡'];
  const pet = $('#pet'), fl = $('.fl', pet), sayEl = $('#say'); let ti = 0, sayT = 0;
  function say(t, ms = 3600) { sayEl.textContent = t; sayEl.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => sayEl.classList.remove('on'), ms); }
  const rnd = (a, b) => a + Math.random() * (b - a), dw = () => $('#desktop').clientWidth;
  const P = { x: 300, y: 0, vy: 0, tx: 0, state: 'idle', until: performance.now() + 1400, drag: false, moved: 0, ox: 0, oy: 0, last: performance.now() };
  const minX = () => mobile() ? 8 : 250, maxX = () => dw() - 72;
  const setState = st => { P.state = st; pet.className = st; };
  function sparkle() { for (let i = 0; i < 5; i++) { const sp = document.createElement('span'); sp.className = 'spk'; sp.textContent = ['✦', '✧', '♡'][i % 3]; sp.style.left = (P.x + 24 + rnd(-18, 18)) + 'px'; sp.style.bottom = (P.y + 74 + rnd(0, 22)) + 'px'; sp.style.setProperty('--dx', rnd(-26, 26) + 'px'); $('#desktop').appendChild(sp); setTimeout(() => sp.remove(), 900); } }
  function hop() { setState('hop'); sparkle(); setTimeout(() => { if (P.state === 'hop' && !P.drag) { setState('idle'); P.until = performance.now() + rnd(1400, 2800); } }, 740); }
  P.x = Math.max(minX(), dw() * .55);
  (function loop(now) {
    const dt = Math.min(.05, (now - P.last) / 1000); P.last = now;
    if (!P.drag) {
      if (P.y > 0 || P.vy) { P.vy -= 1500 * dt; P.y += P.vy * dt; if (P.y <= 0) { P.y = 0; if (P.vy < -260) { P.vy *= -.32; sparkle(); } else { P.vy = 0; setState('idle'); P.until = now + 1500; } } }
      else if (P.state === 'walk') { const d = P.tx - P.x; if (Math.abs(d) < 3) { setState('idle'); P.until = now + rnd(2200, 5200); } else P.x += Math.sign(d) * 58 * dt; }
      else if (P.state === 'idle' && now > P.until) { if (Math.random() < .22) hop(); else { P.tx = rnd(minX(), maxX()); fl.style.transform = `scaleX(${P.tx > P.x ? 1 : -1})`; setState('walk'); } }
    }
    P.x = Math.max(0, Math.min(dw() - 62, P.x)); pet.style.transform = `translate(${P.x}px, ${-P.y}px)`;
    requestAnimationFrame(loop);
  })(performance.now());
  pet.addEventListener('pointerdown', e => { P.drag = true; P.moved = 0; P.ox = e.clientX - P.x; P.oy = ($('#desktop').getBoundingClientRect().bottom - e.clientY) - P.y; pet.setPointerCapture(e.pointerId); setState('hop'); });
  pet.addEventListener('pointermove', e => { if (!P.drag) return; P.moved += Math.abs(e.movementX) + Math.abs(e.movementY); P.x = e.clientX - P.ox; P.y = Math.max(0, ($('#desktop').getBoundingClientRect().bottom - e.clientY) - P.oy); P.vy = 0; });
  pet.addEventListener('pointerup', () => { if (!P.drag) return; P.drag = false; if (P.moved < 6) { say(tips[ti++ % tips.length]); hop(); } else { setState('idle'); P.until = performance.now() + 2000; } });
  setTimeout(() => say(tips[0], 4200), 1800);
  $('#restart').onclick = () => location.reload();

  /* boot */
  const msgs = ['loading sparkles…', 'polishing the glossy buttons…', 'waking up player 1…', 'ready ✿'];
  let p = 0; const t = setInterval(() => { p += 4 + Math.random() * 8; if (p >= 100) { p = 100; clearInterval(t); setTimeout(() => { $('#boot').classList.add('done'); welcome(); }, 250); } $('#fill').style.width = p + '%'; $('#bmsg').textContent = msgs[Math.min(3, Math.floor(p / 26))]; }, 110);
  $('#boot').addEventListener('click', () => { clearInterval(t); $('#boot').classList.add('done'); if (!wins.welcome) welcome(); });
})();
</script>

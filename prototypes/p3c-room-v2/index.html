const sparks = []; for (let i = 0; i < 70; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: starT, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: [0xffe28f, 0xffb3d2, 0xbfa8ff, 0xffffff][i % 4], toneMapped: false })); s.visible = false; s.userData = { life: 0, v: new THREE.Vector3() }; scene.add(s); sparks.push(s); }

/* ============ finalise materials ============ */
const envMats = []; scene.traverse(o => { if (o.isMesh && o.material && o.material.metalness !== undefined && 'envMapIntensity' in o.material) { o.material.envMapIntensity = o.material.metalness > .4 ? 1 : .3; envMats.push([o.material, o.material.envMapIntensity]); } });

envMatsRef = envMats; scene.updateMatrixWorld(true);

/* ============ picking + labels ============ */
const ITEM = {}; scene.traverse(o => { if (o.isGroup && MODS.includes(o.userData.id)) ITEM[o.userData.id] = o; });
const ANCH = {}; MODS.forEach(id => { const b = new THREE.Box3().setFromObject(ITEM[id]); ANCH[id] = b.getCenter(new THREE.Vector3()); ANCH[id].y = b.max.y + .2; });
const CAM = { profile: { p: [1.9, 3.8, 3.6], l: [.2, 3.0, -3.8] }, projects: { p: [.6, 3.8, 3.2], l: [-1.9, 1.25, -3.2] }, experience: { p: [4.8, 3.6, 3.2], l: [2.7, 1.9, -3.6] }, skills: { p: [-.2, 3.4, 3.8], l: [-3.4, 1.5, 0] }, leadership: { p: [5.5, 3.2, 4.6], l: [2.9, 1.0, .6] }, contact: { p: [5.9, 3.4, 6.2], l: [3.1, 1.2, 2.7] } };
const tagsEl = $('#tags'), TAG = {};
MODS.forEach(id => { const d = document.createElement('button'); d.className = 'tag'; d.textContent = LABELS[id][0] + ' ' + LABELS[id][1]; d.style.animationDelay = (-Math.random() * 3) + 's'; d.onclick = () => select(id); d.onmouseenter = () => hover(id); d.onmouseleave = () => hover(null); d.onfocus = () => hover(id); d.onblur = () => hover(null); tagsEl.appendChild(d); TAG[id] = d; });
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(9, 9); let hovered = null, cur = null, drag = null, moved = false, yaw = 0, yawV = 0, pitch = 0, zoom = 1;
function owner(o) { while (o) { if (o.userData && (MODS.includes(o.userData.id) || o.userData.id === 'cat')) return o.userData.id; o = o.parent; } return null; }

  scene.traverse(o => { if (o.isMesh && !o.userData.noHL && o.material.emissive && o.material.userData.baseEi !== undefined) { const g = owner(o); const on = g && g === id; o.material.emissive.setHex(on ? 0x7a2a4a : o.material.userData.baseEm); o.material.emissiveIntensity = on ? .5 : o.material.userData.baseEi; } });
  Object.entries(TAG).forEach(([k, e]) => e.classList.toggle('on', k === id)); cvs.style.cursor = id ? 'pointer' : (drag ? 'grabbing' : 'grab'); }

addEventListener('pointermove', e => { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); if (e.target !== cvs) return;
  if (drag) { const dx = e.clientX - drag.x; yawV = dx * .0035; yaw = clamp(yaw + dx * .005, -.9, .9); pitch = clamp(pitch + (e.clientY - drag.y) * .002, -.2, .4); drag = { x: e.clientX, y: e.clientY }; if (Math.abs(dx) > 1) moved = true; } else { const id = pick(e.clientX, e.clientY); hover(id === 'cat' ? null : id); if (id === 'cat') cvs.style.cursor = 'pointer'; } });

cvs.addEventListener('wheel', e => { if (cur) return; e.preventDefault(); zoom = clamp(zoom + e.deltaY * .001, .72, 1.25); }, { passive: false });

/* ============ audio (tiny synth, off by default) ============ */

function beep(f, d = .08, type = 'sine', v = .06) { if (!soundOn || !ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); }
$('#sndBtn').onclick = () => { soundOn = !soundOn; $('#sndBtn').textContent = soundOn ? '🔊 sound' : '🔇 sound'; initAudio(); beep(880, .12); setTimeout(() => beep(1320, .12), 90); };

/* ============ cat ============ */
function petCat() { catAwake = 3.2; catJump = 1; beep(520, .15, 'triangle', .07); setTimeout(() => beep(700, .2, 'triangle', .06), 120); const v = ANCH.profile.clone(); const p = new THREE.Vector3(); cat.getWorldPosition(p); p.y += .8; p.project(camera); const m = document.createElement('div'); m.className = 'meow'; m.textContent = ['mew~', 'prrr…', 'nya!', '♡'][Math.floor(Math.random() * 4)]; m.style.left = (p.x * .5 + .5) * innerWidth + 'px'; m.style.top = (-p.y * .5 + .5) * innerHeight + 'px'; document.body.appendChild(m); setTimeout(() => m.remove(), 1500); const w = new THREE.Vector3(); cat.getWorldPosition(w); w.y += .3; burst(w, 10); }

/* ============ panel / camera ============ */
const panel = $('#panel'), nextPrev = d => { const i = MODS.indexOf(cur); return MODS[(i + d + MODS.length) % MODS.length]; };
let camPos = new THREE.Vector3(), lookAt = new THREE.Vector3(), tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
const baseDir = () => { const k = mobile() ? (innerWidth / innerHeight < .7 ? 1.9 : 1.4) : 1; return new THREE.Vector3(8.2, 7.2, 10.4).multiplyScalar(k * zoom); };
const LOOK0 = new THREE.Vector3(0, 1.6, 0);
camPos.copy(baseDir()); lookAt.copy(LOOK0); tPos.copy(camPos); tLook.copy(lookAt);

  $('#prev').textContent = '← ' + LABELS[nextPrev(-1)][1]; $('#next').textContent = LABELS[nextPrev(1)][1] + ' →';
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); $('#hint').style.opacity = 0; Object.values(TAG).forEach(t => t.style.opacity = 0);
  history.replaceState(null, '', '#' + id); beep(784, .1, 'triangle', .07); setTimeout(() => beep(1175, .16, 'triangle', .06), 90);
  const wp = new THREE.Vector3(); ITEM[id].getWorldPosition(wp); wp.y = ANCH[id].y - .2; burst(wp, 20); if (first) setTimeout(() => $('#pbody').focus({ preventScroll: true }), 500);

function close() { cur = null; tPos = baseDir(); tLook = LOOK0.clone(); panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); $('#hint').style.opacity = .7; Object.values(TAG).forEach(t => t.style.opacity = 1); history.replaceState(null, '', location.pathname); beep(440, .12, 'sine', .05); }
$('#close').onclick = close; $('#home').onclick = e => { e.preventDefault(); close(); }; $('#prev').onclick = () => select(nextPrev(-1)); $('#next').onclick = () => select(nextPrev(1));
addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return; if (e.key === 'Escape') { close(); $('#list').classList.remove('on'); } if (cur && e.key === 'ArrowRight') select(nextPrev(1)); if (cur && e.key === 'ArrowLeft') select(nextPrev(-1)); });
$('#listItems').innerHTML = MODS.map(id => `<button data-id="${id}">${LABELS[id][0]} ${LABELS[id][1]}</button>`).join(''); $('#listBtn').onclick = () => $('#list').classList.add('on'); $('#list').onclick = e => { const b = e.target.closest('button'); if (b) select(b.dataset.id); $('#list').classList.remove('on'); };
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (MODS.includes(id) && id !== cur) select(id); else if (!id) close(); });

/* ============ day / night ============ */
const hr = new Date().getHours(), qn = new URLSearchParams(location.search).get('night'); let night = qn !== null ? +qn : (hr >= 19 || hr < 6) ? 1 : 0, nightT = night;
document.body.classList.toggle('night', !!nightT); $('#nightBtn').textContent = nightT ? '☀ day' : '🌙 night';
$('#nightBtn').onclick = () => { nightT = nightT ? 0 : 1; document.body.classList.toggle('night', !!nightT); $('#nightBtn').textContent = nightT ? '☀ day' : '🌙 night'; beep(nightT ? 330 : 660, .25, 'sine', .06); };
const dayH = new THREE.Color(0xfff0f6), nightH = new THREE.Color(0x6a58c8), warmOff = new THREE.Color(0xcfc3b8), warmOn = new THREE.Color(0xffe2a0), tmp = new THREE.Color();

/* ============ post-processing (bloom) with safe fallback ============ */
let composer = null, bloom = null;
function buildComposer() { try { const w = innerWidth, h = innerHeight; const rt = new THREE.WebGLRenderTarget(w * renderer.getPixelRatio(), h * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 }); composer = new EffectComposer(renderer, rt); composer.addPass(new RenderPass(scene, camera)); bloom = new UnrealBloomPass(new THREE.Vector2(w, h), .35, .6, .88); composer.addPass(bloom); composer.addPass(new OutputPass()); } catch (e) { composer = null; console.warn('bloom disabled', e); } }
buildComposer();
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 800 ? (w / h < .7 ? 52 : 44) : 30; camera.updateProjectionMatrix(); if (composer) composer.setSize(w, h); if (!cur) tPos = baseDir(); }
resize(); addEventListener('resize', resize);

/* ============ animation state ============ */
const open = Object.fromEntries(MODS.map(id => [id, 0])), hov = Object.fromEntries(MODS.map(id => [id, 0]));
const tclock = new THREE.Clock(), v3 = new THREE.Vector3(); let screenT = 0, lastScreen = 0;
function frame() {
  const dt = Math.min(tclock.getDelta(), .05), t = tclock.elapsedTime;
  night += (nightT - night) * Math.min(1, dt * 2.2); const dayK = 1 - night;
  hemi.intensity = .85 - night * .7; hemi.color.lerpColors(dayH, nightH, night); sun.intensity = 2.7 * dayK + .15; sun.color.setHex(0xfff0dc); moonL.intensity = night * .55; renderer.toneMappingExposure = 1.08 - night * .12; if (Math.abs(night - bgN) > .01) drawBg(night);
  deskLamp.intensity = night * 5; floorLamp.intensity = night * 6; fairyL.intensity = night * 3.5;
  skyNight.material.opacity = night; patchMat.opacity = .22 * dayK; beamMat.opacity = .16 * dayK;
  tmp.lerpColors(warmOff, warmOn, night); fairy.forEach((m, i) => m.color.copy(tmp).multiplyScalar(1 + .25 * Math.sin(t * 2 + i))); bulbD.material.color.copy(tmp).multiplyScalar(.55); bulbF.material.color.copy(tmp).multiplyScalar(.8); shadeD.material.emissiveIntensity = night * .55; shadeF.material.emissiveIntensity = night * .8;
  vBulbs.forEach((m, i) => m.color.lerpColors(warmOff, warmOn, Math.max(night, hov.skills * .8 + open.skills * 1)).multiplyScalar(1 + open.skills * .6));
  if (bloom) { bloom.strength = .2 + night * .38 + (open.skills + open.leadership) * .1; bloom.threshold = .9 - night * .06; }
  MODS.forEach(id => { open[id] = lerp(open[id], cur === id ? 1 : 0, Math.min(1, dt * 5)); hov[id] = lerp(hov[id], hovered === id ? 1 : 0, Math.min(1, dt * 9)); });
  // hover pop
  MODS.forEach(id => { if (ITEM[id].position.lengthSq() > 0) ITEM[id].scale.setScalar(1 + hov[id] * .025); });
  // per-item reactions
  poster.position.z = poster.userData.baseZ + open.profile * .2 + hov.profile * .05; pic.rotation.z = Math.sin(t * 1.2) * .03 * (open.profile + .3);
  const wakeS = Math.max(open.projects, hov.projects * .6); if (t - lastScreen > .12) { lastScreen = t; if (Math.random() < .35 + wakeS * .4) { lineP += 14 + Math.random() * 16; if (lineP > 220) { lineP = 0; lineN++; } } drawScreen(t, wakeS); }
  desk.children.forEach(() => { }); steam.forEach((s, i) => { const k = ((t * .5 + i * .25) % 1); s.position.set(-.85 + Math.sin(k * 6 + i) * .05, 1.5 + k * .55, -3.05); s.material.opacity = (1 - k) * .35 * (0.5 + wakeS); s.scale.setScalar(.12 + k * .25); });
  bookOut.position.z = open.experience * .42 + hov.experience * .06; bookOut.rotation.y = open.experience * -.35; bkM.material.emissiveIntensity = .12 + open.experience * .5;
  crownG.rotation.y = t * (.5 + open.leadership * 2.5); crownG.position.y = 1.0 + Math.sin(t * 1.6) * .03 + open.leadership * .28; spot.material.opacity = (.04 + open.leadership * .12 + hov.leadership * .06) * (.6 + night * .8);
  flagP.rotation.z = lerp(-1.3, 0, Math.max(open.contact, hov.contact * .7)); letterM.position.y = 1.88 + open.contact * .45 + Math.sin(t * 2) * .01; letterM.rotation.y = open.contact * .6;
  // cat
  catAwake = Math.max(0, catAwake - dt); const awake = catAwake > 0; eyesOpen.visible = awake; eyesShut.visible = !awake; catJump = Math.max(0, catJump - dt * 1.4);
  const br = Math.sin(t * 1.7) * (awake ? .012 : .02); catBody.scale.set(1 + br, .7 + br * 1.5, 1.3); cat.position.y = .96 + Math.sin(catJump * 3.14) * .3; catHead.rotation.x = Math.sin(t * .8) * .04 + (awake ? -.1 : .1); ears[0].rotation.z = Math.sin(t * 3) > .96 ? .3 : 0;
  tailS.forEach((s, i) => { const w = Math.sin(t * (awake ? 5 : 1.2) - i * .6) * (.03 + i * .035) * (awake ? 2.2 : 1); s.position.x = w; s.position.y = .1 + i * .008; });
  zs.forEach((s, i) => { const k = ((t * .25 + i / 3) % 1); s.position.set(.3 + k * .15, .55 + k * .6, .5); s.material.opacity = awake ? 0 : Math.sin(k * 3.14) * .9; s.scale.setScalar(.14 + k * .16); });
  // clock hands (real local time)
  const d = new Date(); mHand.rotation.z = -((d.getMinutes() + d.getSeconds() / 60) / 60) * 6.283; hHand.rotation.z = -(((d.getHours() % 12) + d.getMinutes() / 60) / 12) * 6.283;
  // particles
  if (!reduce) { const pp = dustG.attributes.position; for (let i = 0; i < dustN; i++) { pp.array[i * 3] += dustV[i][0] * dt; pp.array[i * 3 + 1] += dustV[i][1] * dt; pp.array[i * 3 + 2] += dustV[i][2] * dt; if (pp.array[i * 3 + 1] > 4.6) pp.array[i * 3 + 1] = .3; if (Math.abs(pp.array[i * 3]) > 3.7) dustV[i][0] *= -1; if (Math.abs(pp.array[i * 3 + 2]) > 3.7) dustV[i][2] *= -1; } pp.needsUpdate = true; }
  dust.material.opacity = .25 + dayK * .35; sparks.forEach(s => { const u = s.userData; if (u.life <= 0) return; u.life -= dt; u.v.y -= 2.2 * dt; s.position.addScaledVector(u.v, dt); s.material.opacity = clamp(u.life / u.max, 0, 1); s.material.rotation += dt * 3; if (u.life <= 0) s.visible = false; });

  requestAnimationFrame(frame);
}
let pend = 1; function loaded() { if (--pend > 0) return; $('#lp').textContent = 'ready ♡'; setTimeout(() => $('#loader').classList.add('done'), 350); const id = location.hash.slice(1); if (MODS.includes(id)) setTimeout(() => select(id), 800); }
frame(); setTimeout(() => { if (pend > 0) { pend = 1; loaded(); } }, 4500);

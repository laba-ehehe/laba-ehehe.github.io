  slots.forEach((s, i) => { const pos = list.indexOf(i); if (pos < 0) { s.classList.add('hid'); s.style.transform = 'translate3d(0,0,-600px) scale(.5)'; s.querySelector('.card').classList.remove('act'); return; } s.classList.remove('hid'); const o = pos - cur, a = Math.abs(o); const vis = a <= 4;
    s.style.transitionDelay = dealing ? (pos * .05) + 's' : '0s'; s.style.transform = `translate3d(${o * gap + Math.sign(o) * (a > 0 ? 30 : 0)}px, ${a * 8}px, ${-a * 140}px) rotateY(${Math.max(-60, Math.min(60, -o * 28))}deg) scale(${a === 0 ? 1 : .94})`; s.style.opacity = vis ? 1 : 0; s.style.pointerEvents = vis ? 'auto' : 'none'; s.style.zIndex = 100 - a; s.querySelector('.card').classList.toggle('act', a === 0); if (a !== 0) resetTilt(s.querySelector('.card')); });
  const c = CARDS[list[cur]]; $('#cap').innerHTML = `${esc(c.name)}<small>${String(list[cur] + 1).padStart(3, '0')}/${CARDS.length} · ${RLABEL[c.r]}</small>`; [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === cur)); }
function go(n) { if (!list.length) return; cur = (n + list.length) % list.length; layout(); beep(520 + cur * 20, .07); if (document.body.classList.contains('inspect')) fillInfo(); }
$('#aL').onclick = () => go(cur - 1); $('#aR').onclick = () => go(cur + 1);
function buildDots() { $('#dots').innerHTML = list.map((_, k) => `<button aria-label="Card ${k + 1}"></button>`).join(''); [...$('#dots').children].forEach((d, k) => d.onclick = () => go(k)); }
function setFilter(f) { filter = f; list = CARDS.map((c, i) => [c, i]).filter(([c]) => f === 'all' || catOf(c) === f).map(([, i]) => i); cur = 0; buildDots(); layout(); renderTabs(); buildBinder(); }
function renderTabs() { $('#tabs').innerHTML = CATS.map(([k, l]) => `<button class="tab ${k === filter ? 'on' : ''}" data-k="${k}">${l}</button>`).join(''); [...$('#tabs').children].forEach(b => b.onclick = () => setFilter(b.dataset.k)); }
addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if ($('#packWrap') && !$('#packWrap').classList.contains('gone')) { if (e.key === 'Enter' || e.key === ' ') tear(); return; } if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInfo(); } else if (e.key === 'Escape') closeInfo(); else if (e.key === 'g') toggleView(); });
let sx = 0, moved = 0, dragging = false; const st = $('#stage'); st.addEventListener('pointerdown', e => { dragging = true; sx = e.clientX; moved = 0; }); addEventListener('pointermove', e => { if (dragging) moved = Math.abs(e.clientX - sx); }); addEventListener('pointerup', e => { if (dragging && moved > 60) go(cur + (e.clientX < sx ? 1 : -1)); dragging = false; setTimeout(() => moved = 0, 30); });
st.addEventListener('wheel', e => { if (document.body.classList.contains('inspect')) return; e.preventDefault(); if (wheelLock) return; wheelLock = true; setTimeout(() => wheelLock = false, 380); go(cur + (e.deltaY + e.deltaX > 0 ? 1 : -1)); }, { passive: false }); let wheelLock = false;

/* ================= holo tilt ================= */
let tiltEl = null, tx = 0, ty = 0, target = null, auto = 0;
function setVars(card, px, py, strength) { const rx = (py - .5) * -26, ry = (px - .5) * 26; card.style.setProperty('--rx', rx + 'deg'); card.style.setProperty('--ry', ry + 'deg'); card.style.setProperty('--sc', 1 + strength * .05); card.style.setProperty('--px', px * 100 + '%'); card.style.setProperty('--py', py * 100 + '%'); card.style.setProperty('--bx', (30 + px * 50) + '%'); card.style.setProperty('--by', (30 + py * 50) + '%'); card.style.setProperty('--fo', .35 + strength * .65); card.style.setProperty('--so', .25 + strength * .75); card.style.setProperty('--go', .18 + strength * .5); }
function resetTilt(card) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); card.style.setProperty('--sc', 1); }
document.addEventListener('pointermove', e => { const card = e.target.closest && e.target.closest('.card.act, #binder .card'); if (card) { const r = card.getBoundingClientRect(); target = { card, px: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), py: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) }; } else target = null; }, { passive: true });
document.addEventListener('pointerleave', () => target = null);
(function loop(t) { const act = document.querySelector('.card.act'); document.querySelectorAll('#binder .card').forEach(c => { if (!target || target.card !== c) { if (c.style.getPropertyValue('--rx') !== '0deg') resetTilt(c); } });
  if (target) setVars(target.card, target.px, target.py, 1); else if (act && !document.body.classList.contains('grid')) { if (!reduce) { const px = .5 + Math.sin(t / 1300) * .32, py = .5 + Math.cos(t / 1700) * .28; setVars(act, px, py, .35); act.style.setProperty('--rx', (py - .5) * -10 + 'deg'); act.style.setProperty('--ry', (px - .5) * 12 + 'deg'); } else setVars(act, .5, .5, .3); }
  requestAnimationFrame(loop); })(0);

/* ================= info panel ================= */
const bullets = a => `<ul class="c-bullets">${a.map(b => `<li>${fmt(b)}</li>`).join('')}</ul>`;
function itemHTML(x) { return `<article class="c-item"><header><div><h3>${esc(x.role)}</h3><p class="c-org">${esc(x.org)}</p></div><span class="c-date">${esc(x.dates)}</span></header>${x.sub ? `<p class="c-sub">${esc(x.sub)}</p>` : ''}${x.stat ? `<p class="c-stat"><b>${esc(x.stat[0])}</b> ${esc(x.stat[1])}</p>` : ''}${bullets(x.bullets)}</article>`; }
function projHTML(p) { return `<article class="c-proj">${p.img ? `<img class="c-img" src="${p.img}" alt="" style="height:170px">` : ''}<div class="c-proj-body"><h3>${esc(p.name)}</h3>${p.badge ? `<p class="c-award">${esc(p.badge)}</p>` : ''}${p.role ? `<p class="c-org">${esc(p.role)} · ${esc(p.dates)}</p>` : ''}<p>${esc(p.desc)}</p>${p.points ? bullets(p.points) : ''}<div class="c-chips">${C.chips(p.tags)}</div>${p.links.length ? `<div class="c-links">${p.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('')}</div>` : ''}</div></article>`; }
function fillInfo() { const c = CARDS[list[cur]]; $('#iKick').textContent = `${String(list[cur] + 1).padStart(3, '0')}/${CARDS.length} · ${RLABEL[c.r]} · ${c.stage.toUpperCase()}`; $('#iTitle').textContent = c.name; const root = $('#info'); root.style.setProperty('--t1', c.t[0]); root.style.setProperty('--t2', c.t[1]);
  const dex = `<div class="dex"><div><small>${esc(c.imp[0])}</small><b>${esc(c.imp[1])}</b></div><div><small>TYPE</small><b>${esc(c.stage)}</b></div><div style="grid-column:1/-1"><small>ENTRY</small><b style="font-weight:700">${esc(c.tl)}</b></div></div>`;
  let body; if (c.exp !== undefined) body = itemHTML(E[c.exp]); else if (c.proj !== undefined) body = projHTML(PR[c.proj]); else if (c.lead !== undefined) body = itemHTML(LD[c.lead]); else body = C.get(c.sec);
  $('#iBody').innerHTML = dex + body; C.wire($('#iBody')); $('#iBody').scrollTop = 0; }
function openInfo() { if (document.body.classList.contains('grid')) return; fillInfo(); document.body.classList.add('inspect'); $('#info').setAttribute('aria-hidden', 'false'); beep(880, .1); }
function closeInfo() { document.body.classList.remove('inspect'); $('#info').setAttribute('aria-hidden', 'true'); }
$('#iX').onclick = closeInfo; document.addEventListener('pointerdown', e => { if (document.body.classList.contains('inspect') && !e.target.closest('#info,.slot,.arrow,header#top,#nav')) closeInfo(); });

/* ================= binder grid ================= */
function buildBinder() { $('#pg').innerHTML = list.map(i => `<div class="pocket" data-i="${i}">${cardHTML(CARDS[i], i)}</div>`).join(''); $('#pg').querySelectorAll('.pocket').forEach(p => { p.querySelector('.card').classList.add('act'); p.addEventListener('click', () => { const pos = list.indexOf(+p.dataset.i); toggleView(); setTimeout(() => { go(pos); openInfo(); }, 60); }); }); }
function toggleView() { const g = document.body.classList.toggle('grid'); $('#bView').textContent = g ? '◫ Carousel' : '▦ Binder'; if (g) closeInfo(); }
$('#bView').onclick = toggleView;

/* ================= sound ================= */
let ac = null, snd = false; function beep(f, d = .08, v = .05) { if (!snd) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch { } }
function rip() { if (!snd) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = ac.sampleRate * .4, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2) * (i % 90 < 45 ? 1 : .3); const s = ac.createBufferSource(); s.buffer = b; const g = ac.createGain(); g.gain.value = .18; s.connect(g); g.connect(ac.destination); s.start(); [880, 1175, 1568].forEach((f, k) => setTimeout(() => beep(f, .3, .06), 250 + k * 110)); } catch { } }
$('#bSnd').onclick = () => { snd = !snd; $('#bSnd').textContent = snd ? '♪ on' : '♪ off'; beep(880, .1); };

/* ================= pack opening ================= */
let torn = false;
function tear() { if (torn) return; torn = true; document.body.classList.remove('pre'); $('#pack').classList.add('tear'); $('#hintP').style.opacity = 0; rip(); setTimeout(() => { $('#flash').classList.add('go'); $('#packWrap').classList.add('gone'); dealIn(); }, reduce ? 50 : 700); }
function dealIn() { slots.forEach(s => { s.style.transition = 'none'; s.style.transform = 'translate3d(0,40px,-200px) scale(.3) rotateY(180deg)'; s.style.opacity = 0; }); void car.offsetWidth; slots.forEach(s => s.style.transition = ''); layout(true); setTimeout(() => slots.forEach(s => s.style.transitionDelay = '0s'), 2200); }
$('#pack').onclick = tear; $('#pack').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') tear(); }; $('#skip').onclick = () => { torn = true; document.body.classList.remove('pre'); $('#packWrap').classList.add('gone'); layout(); };
$('#bPack').onclick = () => { torn = false; document.body.classList.add('pre'); $('#pack').classList.remove('tear'); $('#hintP').style.opacity = 1; $('#flash').classList.remove('go'); $('#packWrap').classList.remove('gone'); closeInfo(); };

/* ================= glitter backdrop ================= */
const gc = $('#glit'), gx = gc.getContext('2d'); let gw, gh, gl = []; function gsz() { gw = gc.width = innerWidth; gh = gc.height = innerHeight; gl = Array.from({ length: Math.min(80, gw / 18) }, () => ({ x: Math.random() * gw, y: Math.random() * gh, r: Math.random() * 1.8 + .4, p: Math.random() * 6, v: Math.random() * .25 + .05 })); } gsz(); addEventListener('resize', () => { gsz(); layout(); });
(function g2(t) { gx.clearRect(0, 0, gw, gh); if (!reduce) gl.forEach(p => { p.y -= p.v; if (p.y < -4) { p.y = gh + 4; p.x = Math.random() * gw; } const a = .25 + .6 * Math.abs(Math.sin(t / 900 + p.p)); gx.fillStyle = `rgba(255,${200 + p.p * 8 | 0},255,${a})`; gx.beginPath(); gx.arc(p.x, p.y, p.r, 0, 7); gx.fill(); }); requestAnimationFrame(g2); })(0);

/* ================= go ================= */
renderTabs(); buildDots(); buildBinder(); layout();
const h = location.hash.slice(1); if (h) { const idx = CARDS.findIndex(c => c.id === h); if (idx >= 0) { torn = true; document.body.classList.remove('pre'); $('#packWrap').classList.add('gone'); cur = idx; layout(); setTimeout(openInfo, 400); } }
})();
</script>

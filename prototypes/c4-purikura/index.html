<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lan Anh · Purikura Booth</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/content.css">
<style>
:root{--ink:#4a2a68;--pk:#ff7fb8;--pk2:#ffc2de;--lv:#c9b3ff;--sky:#bfe6ff;--ye:#fff0a8;
  --c-ink:#4a2a68;--c-mute:#8f78b0;--c-accent:#e0489a;--c-line:#f0dcf7;--c-card:#fff;--c-input:#fff;--c-chip-a:#ffd9ee;--c-chip-b:#d9ecff;--c-chip-c:#fff2b8;--c-chip-d:#d8f7e6;--c-chip-e:#eadcff;
  --c-font-h:'Mochiy Pop One',sans-serif;--c-font-b:'Zen Maru Gothic',sans-serif;--c-btn:#ff7fb8;--c-btn-ink:#fff;--c-radius:16px;--c-bullet:'♡'}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;
  background:radial-gradient(700px 500px at 12% 8%,rgba(255,255,255,.9),transparent 60%),radial-gradient(700px 500px at 92% 90%,rgba(255,255,255,.7),transparent 60%),linear-gradient(135deg,#ffd0e8 0%,#e3d4ff 45%,#c8e8ff 100%)}
button{font:inherit;color:inherit;cursor:pointer}
#glit{position:fixed;inset:0;pointer-events:none;z-index:0}
.puffy{font-family:'Mochiy Pop One',sans-serif;color:var(--pk);paint-order:stroke fill;-webkit-text-stroke:7px #fff;text-shadow:0 4px 0 rgba(255,127,184,.35),0 0 18px rgba(255,255,255,.9);letter-spacing:.02em}
/* top bar */
header#top{position:fixed;left:0;right:0;top:0;z-index:30;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;line-height:1}.logo img{width:30px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(255,255,255,.9)) drop-shadow(0 4px 6px rgba(120,60,160,.3))}.logo small{display:block;font:700 10px 'Zen Maru Gothic';letter-spacing:.35em;color:#9a7fc0;-webkit-text-stroke:0;text-shadow:none;margin-top:2px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);border:2px solid #fff;box-shadow:0 6px 18px rgba(150,90,200,.2)}
.tab{padding:8px 20px;border-radius:999px;border:0;background:transparent;font:900 14px 'Zen Maru Gothic';color:#9a7fc0;transition:all .2s}.tab.on{background:linear-gradient(180deg,#ff9fcc,#ff6fae);color:#fff;box-shadow:0 3px 0 #d04a92,0 6px 14px rgba(255,111,174,.5)}
.tools{display:flex;gap:6px}.tl{padding:8px 15px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);font:900 13px 'Zen Maru Gothic';color:#8a5ab8;white-space:nowrap;text-decoration:none;box-shadow:0 4px 12px rgba(150,90,200,.18)}.tl:hover{background:#fff}
/* views */
.view{position:fixed;left:0;right:0;top:62px;bottom:0;z-index:2;transition:opacity .5s,transform .5s}.view.off{opacity:0;pointer-events:none;transform:scale(.97)}
/* booth */
#booth{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.8fr);gap:26px;padding:12px 4vw 24px;align-items:center;max-width:1300px;margin:0 auto}
#cam{position:relative;aspect-ratio:4/3.1;max-height:calc(100dvh - 120px);width:100%;border-radius:36px;background:linear-gradient(160deg,#ff9fcc,#ffc2de 50%,#ffd9ec);border:7px solid #fff;box-shadow:0 0 0 5px #ffb3d9,0 30px 60px rgba(160,70,160,.35),inset 0 0 60px rgba(255,255,255,.6);overflow:hidden}
#ring{position:absolute;inset:-4%;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,255,255,.0),rgba(255,255,255,.9),rgba(255,255,255,0) 30%,rgba(255,255,255,.9) 55%,rgba(255,255,255,0));filter:blur(14px);opacity:.6;animation:spin 7s linear infinite;mix-blend-mode:soft-light}
@keyframes spin{to{transform:rotate(360deg)}}
#camBg{position:absolute;inset:0;background-size:36px 36px;transition:background .5s;opacity:.9}
#stageAv{position:absolute;left:50%;bottom:-1%;transform:translateX(-50%);transition:transform .35s cubic-bezier(.3,1.5,.4,1)}
#camUI{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px}
#camUI .rec{align-self:flex-start;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.85);font:900 12px 'Zen Maru Gothic';letter-spacing:.14em;color:#e0489a;display:flex;align-items:center;gap:7px}#camUI .rec i{width:9px;height:9px;border-radius:50%;background:#ff3d6e;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
#prompt{position:absolute;left:50%;top:14px;transform:translateX(-50%);white-space:nowrap;padding:8px 22px;border-radius:999px;background:rgba(255,255,255,.88);font:900 16px 'Zen Maru Gothic';color:#8a4ac8;box-shadow:0 6px 16px rgba(160,70,160,.25)}
#count{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(100px,26vh,240px) 'Mochiy Pop One';color:var(--pk);paint-order:stroke fill;-webkit-text-stroke:14px #fff;text-shadow:0 8px 0 rgba(255,127,184,.4);opacity:0;pointer-events:none}
#count.pop{animation:cpop .9s cubic-bezier(.2,1.4,.4,1)}@keyframes cpop{0%{opacity:0;transform:scale(2.2)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
#flash{position:fixed;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}#flash.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#panel{padding:22px 22px 24px;border-radius:32px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border:4px solid #fff;box-shadow:0 0 0 4px #ffc2de,0 24px 50px rgba(160,70,160,.25)}
#panel h2{margin:0 0 4px;font-size:30px;line-height:1.1;text-align:center}#panel .sub{text-align:center;font:700 13px 'Zen Maru Gothic';color:#9a7fc0;margin-bottom:14px;letter-spacing:.1em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,var(--a),var(--b));box-shadow:0 5px 0 var(--sh),0 10px 20px rgba(150,80,180,.2);font:900 15px 'Zen Maru Gothic';color:#5a2a78;text-shadow:0 1px 0 rgba(255,255,255,.7);text-align:left;transition:transform .15s,filter .15s;position:relative;overflow:hidden}
.mi::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}.mi:hover::after{transform:translateX(120%)}
.mi:hover{transform:translateY(-3px) rotate(-1deg)}.mi:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}.mi i{font-style:normal;font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}.mi small{display:block;font:700 10px 'Zen Maru Gothic';opacity:.9;letter-spacing:.08em}.mi.done::before{content:'✓';position:absolute;right:10px;top:6px;width:20px;height:20px;border-radius:50%;background:#fff;color:#5fcf8a;font-size:13px;display:grid;place-items:center;text-shadow:none}
.theme{display:flex;gap:8px;margin-top:14px;justify-content:center;align-items:center;font:900 12px 'Zen Maru Gothic';color:#9a7fc0}.theme button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(150,80,180,.3);transition:transform .15s}.theme button.on{outline:3px solid #ff6fae;transform:scale(1.15)}
.allbtn{display:block;margin:14px auto 0;padding:9px 20px;border-radius:999px;border:2px dashed #c9b3ff;background:transparent;font:900 13px 'Zen Maru Gothic';color:#8a5ab8}.allbtn:hover{background:#fff}
/* printer output */
#printer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(380px,90vw);z-index:40;pointer-events:none;height:0}
#slot{position:absolute;left:0;right:0;bottom:0;height:20px;border-radius:12px 12px 0 0;background:linear-gradient(#5a3a78,#2a1a40);box-shadow:0 -4px 20px rgba(60,20,90,.4)}
#out{position:absolute;left:5%;right:5%;bottom:14px;transform:translateY(100%);transition:transform 2.4s cubic-bezier(.4,.1,.3,1);will-change:transform;display:flex;justify-content:center}
#out.print{transform:translateY(0)}
#out .sheet{transform-origin:50% 100%}
/* wall */
#wall{overflow:auto;padding:22px 3vw 80px}
.peg{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.7) 3px,transparent 4px) 0 0/34px 34px,linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,.1))}
#wallGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:34px 22px;max-width:1500px;margin:0 auto;justify-items:center;padding-top:8px}
.slotWrap{position:relative;width:var(--sw);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.slotWrap.empty{height:calc(var(--sw)*1.2);border-radius:18px;border:4px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.35);display:grid;place-items:center;text-align:center;color:#9a7fc0;font:900 15px 'Zen Maru Gothic'}
.slotWrap.empty b{display:block;font:400 26px 'Mochiy Pop One';color:#fff;text-shadow:0 3px 0 rgba(200,140,230,.6)}
.slotWrap:not(.empty){cursor:pointer;transform:rotate(var(--r))}.slotWrap:not(.empty):hover{transform:rotate(0) translateY(-8px) scale(1.03)}
.new{position:absolute;right:-10px;top:-14px;z-index:5;padding:5px 12px;border-radius:999px;background:#ff3d8b;color:#fff;font:900 13px 'Zen Maru Gothic';border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2);animation:nw .8s ease-in-out infinite alternate}@keyframes nw{to{transform:rotate(8deg) scale(1.1)}}
/* sheet */
:root{--sw:330px}
.sheet{position:relative;width:var(--sw);padding:16px 14px 14px;border-radius:14px;background:
  radial-gradient(circle at 20% 10%,rgba(255,255,255,.9),transparent 40%),
  linear-gradient(150deg,var(--a),var(--b) 55%,var(--c));
  box-shadow:0 14px 30px rgba(120,60,160,.3),0 0 0 3px rgba(255,255,255,.9) inset,0 0 0 6px rgba(255,255,255,.25) inset;overflow:hidden;font-size:calc(var(--sw)/22)}
.sheet::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1.2px,transparent 1.8px),radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.6px);background-size:34px 34px,53px 53px;background-position:0 0,17px 22px;opacity:.7;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.3}}
.sheet .bn{position:relative;text-align:center;margin-bottom:.9em}.sheet .bn small{display:block;font:900 .6em 'Zen Maru Gothic';letter-spacing:.5em;color:#fff;text-shadow:0 1px 4px rgba(120,60,160,.5)}.sheet .bn b{font-size:2em;line-height:1.05;display:inline-block;transform:rotate(-2deg)}.sheet .bn i{font:900 .8em 'Zen Maru Gothic';font-style:normal;color:#fff;margin-left:.5em;text-shadow:0 1px 4px rgba(120,60,160,.5)}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.fr{position:relative;margin:0;border-radius:.9em;background:#fff;padding:.4em;box-shadow:0 .25em .7em rgba(100,40,140,.3);transition:transform .25s cubic-bezier(.2,1.4,.4,1);cursor:pointer}.fr:hover{transform:scale(1.05) rotate(var(--fr,1deg));z-index:3}
.fr:nth-child(odd){--fr:-1.5deg}.fr:nth-child(even){--fr:1.5deg}
.ph{position:relative;aspect-ratio:4/4.6;border-radius:.6em;overflow:hidden;background:var(--pat)}
.ph .av{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%) var(--pt,none);transform-origin:50% 100%}
.av{position:relative;width:60px;height:120px}.av img{position:absolute;left:0;top:0;width:60px;height:120px;image-rendering:pixelated}.av img.base{filter:drop-shadow(0 2px 0 rgba(255,255,255,.95))}
.fr figcaption{position:absolute;left:.3em;right:.3em;bottom:.5em;text-align:center;line-height:1.05;pointer-events:none}
.fr figcaption b{display:block;font:400 1.35em/1.05 'Mochiy Pop One';color:#fff;paint-order:stroke fill;-webkit-text-stroke:.28em var(--k,#ff6fae);text-shadow:0 .1em 0 rgba(0,0,0,.18)}
.fr figcaption small{display:inline-block;margin-top:.25em;padding:.1em .6em;border-radius:99px;background:rgba(255,255,255,.92);font:900 .62em 'Zen Maru Gothic';color:#7a4ab8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{position:absolute;right:-.3em;top:-.5em;z-index:2;font:400 1em 'Mochiy Pop One';font-style:normal;color:#fff;background:linear-gradient(180deg,#ffb3d9,#ff6fae);padding:.25em .65em;border-radius:99px;border:.2em solid #fff;box-shadow:0 .2em .5em rgba(0,0,0,.2);transform:rotate(8deg)}
.stk{position:absolute;z-index:2;font-size:1.5em;filter:drop-shadow(0 0 0 #fff) drop-shadow(.06em 0 0 #fff) drop-shadow(-.06em 0 0 #fff) drop-shadow(0 .06em 0 #fff) drop-shadow(0 -.06em 0 #fff);pointer-events:none;animation:wob 3s ease-in-out infinite}@keyframes wob{50%{transform:translateY(-.15em) rotate(6deg)}}
.sheet .ft{position:relative;margin-top:.9em;text-align:center;font:400 .85em 'Yomogi','Zen Maru Gothic';color:#fff;text-shadow:0 1px 3px rgba(120,60,160,.6);letter-spacing:.06em}
.tape{position:absolute;width:5em;height:1.4em;background:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 .5em,rgba(255,200,230,.7) .5em 1em);box-shadow:0 1px 3px rgba(0,0,0,.15)}.tape.a{left:-1.2em;top:.6em;transform:rotate(-38deg)}.tape.b{right:-1.4em;bottom:.8em;transform:rotate(-38deg)}
.hm{position:absolute;z-index:1;font:900 .7em 'Yomogi';color:#fff;text-shadow:0 1px 3px rgba(120,60,160,.5);pointer-events:none}
/* patterns */
.pt0{--pat:repeating-linear-gradient(45deg,#ffe3f0 0 12px,#fff 12px 24px)}
.pt1{--pat:radial-gradient(circle,#fff 3px,transparent 4px) 0 0/20px 20px,#bfe6ff}
.pt2{--pat:linear-gradient(90deg,rgba(255,255,255,.6) 50%,transparent 50%) 0 0/24px 24px,linear-gradient(rgba(255,255,255,.6) 50%,transparent 50%) 0 0/24px 24px,#ffd1e8}
.pt3{--pat:repeating-linear-gradient(0deg,#fff4b8 0 10px,#fffbe0 10px 20px)}
.pt4{--pat:radial-gradient(circle at 30% 30%,#fff 0,transparent 30%),radial-gradient(circle at 70% 70%,#fff 0,transparent 30%),linear-gradient(135deg,#d9c8ff,#ffc8f0)}
.pt5{--pat:repeating-linear-gradient(135deg,#d4f5e4 0 10px,#fff 10px 20px)}
.pt6{--pat:conic-gradient(from 0deg at 50% 60%,#ffe3f0,#fff,#e0f0ff,#fff,#ffe3f0)}
.pt7{--pat:linear-gradient(180deg,#bfe6ff,#e6d4ff 60%,#ffd1e8)}
/* focus + modal */
#zoom{position:fixed;inset:62px 0 0 0;z-index:35;display:none;place-items:center;background:rgba(120,70,170,.5);backdrop-filter:blur(8px);overflow:auto;padding:20px}#zoom.on{display:grid}
#zoomIn{position:relative;--sw:min(560px,92vw);animation:zin .5s cubic-bezier(.2,1.2,.4,1)}@keyframes zin{from{opacity:0;transform:scale(.8) rotate(-4deg)}}
#zoomIn .sheet{--sw:min(540px,92vw)}
#zbtn{position:absolute;right:-14px;top:-14px;z-index:5;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#ff6fae;color:#fff;font:900 18px 'Zen Maru Gothic';box-shadow:0 4px 12px rgba(0,0,0,.3)}
#zhint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:900 13px 'Zen Maru Gothic';color:#fff;z-index:36;text-shadow:0 2px 6px rgba(80,30,120,.6);display:none}#zoom.on~#zhint{display:block}
#dt{position:fixed;inset:0;z-index:55;display:none;place-items:center;padding:20px;background:rgba(90,40,130,.55);backdrop-filter:blur(6px)}#dt.on{display:grid}
.win{position:relative;width:min(700px,100%);max-height:min(86dvh,760px);display:flex;flex-direction:column;border-radius:30px;background:#fffaff;border:5px solid #fff;box-shadow:0 0 0 4px #ffb3d9,0 28px 70px rgba(60,20,90,.55);overflow:hidden;animation:zin .4s cubic-bezier(.2,1.2,.4,1);-webkit-user-select:text;user-select:text}
.win header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(135deg,var(--a,#ffb3d9),var(--b,#c9b3ff));color:#fff}
.win header .av{width:30px;height:60px;flex:none;margin:-8px 0 -22px}.win header .av img{width:30px;height:60px}
.win header div{flex:1}.win header small{display:block;font:900 11px 'Zen Maru Gothic';letter-spacing:.3em;opacity:.95}.win header h2{margin:2px 0 0;font:400 26px/1.1 'Mochiy Pop One';text-shadow:0 3px 0 rgba(0,0,0,.18)}.win header button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25);color:#fff;font:900 16px 'Zen Maru Gothic'}
.win .body{overflow:auto;padding:18px 22px 24px;font-size:15px;line-height:1.6;scrollbar-width:thin;scrollbar-color:#f0cfe8 transparent}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;padding:9px 20px;border-radius:99px;background:#fff;font:900 14px 'Zen Maru Gothic';color:#8a4ac8;box-shadow:0 8px 20px rgba(120,60,160,.3);opacity:0;transition:opacity .3s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:900px){#booth{grid-template-columns:1fr;gap:14px;overflow:auto;height:100%;align-items:start;padding-bottom:40px}#cam{max-height:46dvh;aspect-ratio:4/3}.tabs{order:3;position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:40}header#top .tools .tl.opt{display:none}.logo small{display:none}.menu{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="glit"></canvas>
<header id="top"><div class="logo puffy"><img src="/assets/img/avatar-px.png" alt=""><div>PURIKURA<small>LAN ANH · PHOTO BOOTH</small></div></div>
  <nav class="tabs"><button class="tab on" data-v="booth">📷 Booth</button><button class="tab" data-v="wall">🖼 Photo wall</button></nav>
  <div class="tools"><button class="tl opt" id="bSnd">♪ off</button><a class="tl" href="/assets/Lan-Anh-Do-Resume.pdf" download="Lan-Anh-Do-Resume.pdf">⬇ Resume</a></div></header>

<main id="booth" class="view">
  <div id="cam"><div id="camBg"></div><div id="ring"></div><div id="stageAv"></div><div id="count"></div>
    <div id="camUI"><div class="rec"><i></i>LIVE</div><div id="prompt">Pick what to shoot today ♡</div></div></div>
  <aside id="panel"><h2 class="puffy">What shall we shoot?</h2><div class="sub">どれにする？ · TAP A TOPIC</div><div class="menu" id="menu"></div>
    <div class="theme"><span>THEME</span><span id="themes"></span></div><button class="allbtn" id="printAll">✨ print them all at once</button></aside>
</main>

<section id="wall" class="view off"><div class="peg"></div><div id="wallGrid"></div></section>

<div id="printer"><div id="out"></div><div id="slot"></div></div>
<div id="zoom"><div id="zoomIn"><button id="zbtn" aria-label="Close">✕</button><div id="zsheet"></div></div></div><div id="zhint">tap any photo to read the details ✿</div>
<div id="dt"><div class="win"><header><span class="av" id="dtAv"></span><div><small id="dtK"></small><h2 id="dtT"></h2></div><button id="dtX">✕</button></header><div class="body" id="dtB"></div></div></div>
<div id="flash"></div><div id="toast"></div>

<script src="/shared/data.js"></script>
<script src="/shared/content.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], D = C.D, esc = C.esc, fmt = C.fmt;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, rnd = (a, b) => a + Math.random() * (b - a);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= pixel accessories drawn to fit the 30x44 sprite (16 rows of headroom) ================= */
const OFF = 16, CW = 30, CH = 44 + OFF;
function accCanvas(types) { const c = document.createElement('canvas'); c.width = CW; c.height = CH; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const P = (x, y, col, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y + OFF, w, h); };

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lan Anh · The Slow Train</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/content.css">
<style>
:root{--ink:#3b2f3f;--paper:#fff6e3;--teal:#3fa796;--coral:#ff7a8a;--mute:#8f7f88;--st:#3fa796;
  --c-ink:#3b2f3f;--c-mute:#8f7f88;--c-accent:#d9507a;--c-line:#ead9b8;--c-card:#fffdf6;--c-input:#fff;--c-chip-a:#ffe0ea;--c-chip-b:#d9efe9;--c-chip-c:#fff1b8;--c-chip-d:#dbe8ff;--c-chip-e:#eadfff;
  --c-font-h:'Mochiy Pop One',sans-serif;--c-font-b:'Zen Maru Gothic',sans-serif;--c-btn:#3fa796;--c-btn-ink:#fff;--c-radius:14px;--c-bullet:'▸'}
*{box-sizing:border-box}
html,body{margin:0;background:#241a2e}
html.lock{overflow:hidden}
body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#spacer{width:1px;pointer-events:none}
#scene{position:fixed;top:0;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;z-index:0;display:block}

/* ---------- HUD ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding:12px 16px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;background:rgba(255,246,227,.92);border:2px solid #fff;box-shadow:0 3px 0 rgba(59,47,63,.18),0 8px 22px rgba(30,15,40,.25);border-radius:16px;padding:6px 14px 6px 8px;justify-self:start}
.brand img{width:30px;height:44px;image-rendering:pixelated;object-fit:cover;object-position:top;height:36px;width:25px}
.brand b{display:block;font:400 15px/1.1 'Mochiy Pop One';letter-spacing:.02em}
.brand span{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em}
#map{position:relative;width:min(560px,46vw);height:62px;background:rgba(255,246,227,.92);border:2px solid #fff;border-radius:18px;box-shadow:0 3px 0 rgba(59,47,63,.18),0 8px 22px rgba(30,15,40,.25);padding:0 26px}
#map .rail{position:absolute;left:34px;right:34px;top:20px;height:6px;border-radius:4px;background:repeating-linear-gradient(90deg,#c9bda4 0 8px,#b3a78e 8px 10px)}
#map .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--teal);width:0}
#mark{position:absolute;top:-9px;left:0;width:26px;height:16px;margin-left:-13px;border-radius:6px 6px 3px 3px;background:linear-gradient(#ff8fa3,#ff6f86);border:2px solid #fff;box-shadow:0 2px 0 rgba(59,47,63,.35);z-index:3}
#mark::before{content:'';position:absolute;left:3px;top:3px;right:3px;height:5px;border-radius:2px;background:linear-gradient(90deg,#cdeeff 0 40%,#fff 40% 46%,#cdeeff 46%)}
.stop{position:absolute;top:0;width:60px;margin-left:-30px;text-align:center;font-size:10.5px;font-weight:900;color:var(--mute);line-height:1.15;padding-top:14px}
.stop i{display:block;margin:0 auto 5px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #c9bda4;transition:.25s;position:relative;z-index:2}
.stop:hover i,.stop.on i{border-color:var(--sc);background:var(--sc);transform:scale(1.18)}
.stop.on{color:var(--ink)}
.stop small{display:block;font-weight:700;opacity:.7;font-size:9.5px}
.tools{display:flex;gap:8px;justify-self:end}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,246,227,.92);border:2px solid #fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:13px;color:var(--ink);text-decoration:none;box-shadow:0 3px 0 rgba(59,47,63,.18),0 8px 22px rgba(30,15,40,.25)}
.pill:hover{background:#fff}
#led{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:9;background:#14101a;border:3px solid #3a3342;border-radius:8px;padding:6px 16px;font:400 15px/1 'DotGothic16',monospace;color:#ffb347;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,160,50,.7);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:min(420px,86vw);text-align:center;transition:opacity .3s}
#led em{font-style:normal;color:#8cf0a8;text-shadow:0 0 6px rgba(120,255,160,.6)}
#sign{position:fixed;left:0;top:0;z-index:4;pointer-events:none;width:176px;background:#fff;border:3px solid #2e3b6b;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.25);text-align:center;transform-origin:50% 100%;will-change:transform;display:none}
#sign .no{position:absolute;left:-14px;top:-14px;width:34px;height:34px;border-radius:50%;background:var(--st);color:#fff;font:700 11px/34px 'Zen Maru Gothic';border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#sign .band{height:11px;background:var(--st);border-radius:3px 3px 0 0}
#sign b{display:block;font:900 27px/1.15 'Zen Maru Gothic';color:#232a4d;padding:6px 8px 0;letter-spacing:.05em}
#sign small{display:block;font:700 12px 'Zen Maru Gothic';color:#5a6290;padding:0 8px 7px;letter-spacing:.12em;text-transform:uppercase}
#bubble{position:fixed;z-index:5;left:0;top:0;max-width:210px;padding:8px 12px;background:#fff;border:2px solid var(--ink);border-radius:14px;font-weight:900;font-size:13px;line-height:1.3;box-shadow:0 3px 0 rgba(59,47,63,.3);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
#bubble.on{opacity:1;transform:none}
#bubble::after{content:'';position:absolute;left:24px;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;display:flex;gap:10px;align-items:center}
.go{background:var(--st);color:#fff;font:400 17px 'Mochiy Pop One';padding:13px 26px;border-radius:999px;border:3px solid #fff;box-shadow:0 5px 0 rgba(40,25,50,.35),0 12px 28px rgba(20,10,30,.35);transition:transform .15s,opacity .3s;display:none}
.go.show{display:inline-flex;gap:8px;align-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.go:hover{transform:translateY(-2px) scale(1.03)}.go:active{transform:translateY(2px)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:11;color:#fff;font-weight:900;font-size:14px;letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.55);animation:hint 1.6s ease-in-out infinite;pointer-events:none;transition:opacity .4s;text-align:center;background:rgba(36,26,46,.55);padding:8px 18px;border-radius:999px;backdrop-filter:blur(4px)}
@keyframes hint{50%{transform:translate(-50%,6px)}}
#plain{position:fixed;left:16px;bottom:18px;z-index:12}
.mini{background:rgba(255,246,227,.92);border:2px solid #fff;border-radius:999px;padding:7px 13px;font-weight:900;font-size:12px;box-shadow:0 3px 0 rgba(59,47,63,.18)}
.mini:hover{background:#fff}
#pager{position:fixed;right:16px;bottom:18px;z-index:12;display:flex;gap:6px}

/* ---------- Ticket panel ---------- */
#veil{position:fixed;inset:0;z-index:30;background:rgba(30,18,44,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
#veil.on{opacity:1;pointer-events:auto}
#panel{position:fixed;left:50%;bottom:0;width:min(960px,97vw);max-height:88vh;z-index:40;display:flex;flex-direction:column;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -10px 50px rgba(20,10,35,.45);transform:translate(-50%,108%);transition:transform .6s cubic-bezier(.2,.9,.25,1);overflow:hidden}
#panel.open{transform:translate(-50%,0)}
.tk{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:20px 28px 18px;background:linear-gradient(120deg,color-mix(in srgb,var(--st) 24%,#fff),#fffaf0 60%);border-bottom:3px dashed #d9c9a4}
.tk::before,.tk::after{content:'';position:absolute;bottom:-12px;width:22px;height:22px;border-radius:50%;background:#241a2e;opacity:.0}
.tk .num{width:52px;height:52px;border-radius:50%;background:var(--st);color:#fff;display:grid;place-items:center;font:700 14px 'Zen Maru Gothic';border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tk h2{margin:0;font:400 30px/1.1 'Mochiy Pop One';letter-spacing:.02em}
.tk h2 small{font:900 12px 'Zen Maru Gothic';letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-left:10px;white-space:nowrap}
.tk p{margin:5px 0 0;font-weight:700;color:var(--mute);font-size:13px}
.tk .stamp{font:700 11px 'DotGothic16';color:var(--st);border:2px solid var(--st);border-radius:8px;padding:4px 9px;transform:rotate(5deg);line-height:1.2;text-align:center;letter-spacing:.08em}
#x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #e5d6b3;font-weight:900;z-index:3}
#x:hover{background:#ffe7ec}
.tkb{overflow:auto;padding:24px 28px 8px;overscroll-behavior:contain;flex:1;font-size:15px;line-height:1.55}
.tkf{display:flex;justify-content:space-between;gap:10px;padding:14px 28px 18px;border-top:2px solid #f0e3c4;background:#fff9ec;flex-wrap:wrap}
.tkf button{border-radius:999px;font-weight:900;padding:10px 20px;font-size:14px}
.tkf .a{background:#fff;border:2px solid #d9c9a4}.tkf .a:hover{background:#f8efd8}
.tkf .b{background:var(--st);color:#fff;border:2px solid var(--st);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tkb .c-item,.tkb .c-proj,.tkb .c-edu{box-shadow:0 2px 0 #f1e5c8}
.tkb .c-btn{font-family:inherit}
.plainsec{margin:0 0 34px}.plainsec>h3{font:400 22px 'Mochiy Pop One';margin:0 0 12px;color:var(--st)}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(255,236,214,.55),rgba(36,26,46,.82));transition:opacity .7s,visibility .7s;padding:18px}
#intro.off{opacity:0;visibility:hidden;pointer-events:none}
.ticket{position:relative;width:min(560px,94vw);background:#fff6e3;border-radius:20px;box-shadow:0 22px 60px rgba(20,10,30,.5);display:grid;grid-template-columns:1fr 130px;overflow:hidden;animation:tin .9s cubic-bezier(.2,.9,.25,1)}
@keyframes tin{from{transform:translateY(40px) rotate(-3deg);opacity:0}}
.ticket .l{padding:24px 26px 22px}
.ticket .r{border-left:3px dashed #d9c9a4;padding:18px 14px;text-align:center;background:linear-gradient(#ffe9ef,#ffdbe4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ticket .r img{width:60px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.ticket .r span{font:700 10px 'DotGothic16';letter-spacing:.1em;color:#a0566c}
.ticket small{font:900 11px 'Zen Maru Gothic';letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.ticket h1{margin:6px 0 4px;font:400 33px/1.08 'Mochiy Pop One'}
.ticket p{margin:0 0 14px;font-weight:700;color:#6b5c68;line-height:1.5;font-size:14px}
.route{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;margin:0 0 16px}
.route b{background:#fff;border:2px solid #e3d3ad;border-radius:8px;padding:3px 9px}
.route hr{flex:1;border:0;border-top:3px dotted #cdbd98;margin:0}
.ticket .go{display:inline-flex;font-size:16px;padding:11px 22px}
@media(max-width:820px){#top{grid-template-columns:1fr auto}#map{grid-column:1/-1;grid-row:2;width:100%}.stop small{display:none}#led{top:132px}.brand span{display:none}}
@media(max-width:560px){.ticket{grid-template-columns:1fr}.ticket .r{display:none}.tk h2{font-size:23px}.tk{grid-template-columns:auto 1fr;padding:16px 18px}.tk .stamp{display:none}.tkb{padding:18px}.tkf{padding:12px 18px 16px}#pager{display:none}.stop{font-size:9px;width:46px;margin-left:-23px}}
@media(prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Pixel-art view from the window of a slow train"></canvas>
<div id="spacer"></div>

<header id="top">
  <div class="brand"><img src="/assets/img/avatar-px.png" alt=""><div><b>LAN ANH LINE</b><span>ラン・アン線 · portfolio local</span></div></div>
  <nav id="map" aria-label="Route map"><div class="rail"><div class="fill" id="fill"></div><i id="mark"></i></div></nav>
  <div class="tools"><button class="pill" id="snd" aria-pressed="false">♪ sound off</button><a class="pill" href="/assets/Lan-Anh-Do-Resume.pdf" download="Lan-Anh-Do-Resume.pdf">⬇ resume</a></div>
</header>
<div id="led"><span id="ledtxt"></span></div>
<div id="sign"><div class="no" id="sno">LA01</div><div class="band"></div><b id="skana"></b><small id="sro"></small></div>
<div id="bubble"></div>
<div id="hint">scroll to ride ↓</div>
<div id="bar"><button class="go" id="get">Get off ▸</button></div>
<button class="mini" id="plain">☰ plain text version</button>
<div id="pager"><button class="mini" id="prev" aria-label="Previous stop">◀ back</button><button class="mini" id="next" aria-label="Next stop">next stop ▶</button></div>

<div id="veil"></div>
<section id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <button id="x" aria-label="Close">✕</button>
  <div class="tk"><div class="num" id="pnum">01</div><div><h2 id="ptitle"></h2><p id="psub"></p></div><div class="stamp" id="pstamp">乗車券<br>VALID</div></div>
  <div class="tkb" id="pbody"></div>
  <div class="tkf"><button class="a" id="pback">← back to the window</button><button class="b" id="pnext">ride to next stop ▸</button></div>
</section>

<div id="intro">
  <div class="ticket">
    <div class="l">
      <small>乗車券 · boarding ticket</small>
      <h1>The Slow Train<br>to Lan Anh</h1>
      <p>Computer Engineering + Economics @ UF. Scroll to ride through six little stations, one for each part of my story.</p>
      <div class="route"><b>はじまり</b><hr><b>てがみ</b></div>
      <button class="go show" id="board" style="--st:#ff7a8a">Board the train ▸</button>
    </div>
    <div class="r"><img src="/assets/img/avatar-px.png" alt="Lan Anh pixel avatar"><span>PASSENGER<br>LAN ANH DO</span></div>
  </div>
</div>

<noscript><p style="position:relative;z-index:99;background:#fff;padding:20px">This page needs JavaScript. Resume: <a href="/assets/Lan-Anh-Do-Resume.pdf">PDF</a>.</p></noscript>

<script src="/shared/data.js"></script>
<script src="/shared/content.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const D = window.PORTFOLIO, C = window.C;
const ST = [
  { id:'profile',    kana:'はじまり', ro:'Hajimari', num:'LA01', sub:'meet the passenger',  col:'#ff7a8a', say:"welcome aboard! I'm Lan Anh ♡" },
  { id:'skills',     kana:'どうぐ',   ro:'Dōgu',     num:'LA02', sub:'tools & spells',      col:'#f0a928', say:'my toolbox lives here ✦' },
  { id:'experience', kana:'けいけん', ro:'Keiken',   num:'LA03', sub:"where she's worked",  col:'#3fa796', say:'six stops of experience →' },
  { id:'projects',   kana:'つくる',   ro:'Tsukuru',  num:'LA04', sub:'things she built',    col:'#4f86e0', say:'built it. shipped it. ♪' },
  { id:'leadership', kana:'みんな',   ro:'Minna',    num:'LA05', sub:'leading together',    col:'#e0577a', say:'leading is a team sport.' },
  { id:'contact',    kana:'てがみ',   ro:'Tegami',   num:'LA06', sub:'end of the line',     col:'#8f6fe0', say:'last stop! write me a letter ✉' }
];
const N = ST.length, SEG = 1500;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const sstep = (a,b,v) => { const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const hash = n => { n = Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); };
const mod = (a,b) => ((a%b)+b)%b;
const hex = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
const mixA = (a,b,t) => a.map((v,i) => v+(b[i]-v)*t);
const css = a => `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------------- time of day ---------------- */
const KEYS = [
  [0,  '#79bdff','#d9f1ff','#ffffff'],
  [.2, '#68b4ff','#c6ebff','#ffffff'],
  [.4, '#8db2ee','#ffd9a0','#ffecd0'],
  [.6, '#7a68cc','#ff9aa8','#ffc4b4'],
  [.8, '#33307a','#b06ab0','#a08ac8'],
  [1,  '#0e1236','#37307a','#5a5ca0']
].map(k => [k[0], hex(k[1]), hex(k[2]), hex(k[3])]);
function keyAt(p){
  for (let i = 0; i < KEYS.length-1; i++) if (p <= KEYS[i+1][0]) {
    const t = (p-KEYS[i][0])/(KEYS[i+1][0]-KEYS[i][0]);
    return [1,2,3].map(j => mixA(KEYS[i][j], KEYS[i+1][j], t));
  }
  return KEYS[KEYS.length-1].slice(1);
}

/* ---------------- canvas set-up ---------------- */
const cv = $('#scene'), gm = cv.getContext('2d', { alpha:false });
const H = 144, WY0 = 24, WY1 = 106, HZ = 68;
let W = 256, SC = 5, VX0 = 0, VW = 256, WX0 = 8, WX1 = 248, leftPx = 0;
let Sc, gS, Lc, gl, Tc, gT, g = gm;
let INT = {}, tiles = {};
const avatar = new Image(); avatar.src = '/assets/img/avatar-px.png';
let avReady = false; avatar.onload = () => { avReady = true; };

function resize(){
  SC = innerHeight / H;
  W = Math.max(210, Math.ceil(innerWidth / SC));
  VW = Math.min(W, innerWidth / SC);
  VX0 = Math.round((W - VW) / 2);
  leftPx = -((W*SC) - innerWidth) / 2;
  cv.width = W; cv.height = H;
  cv.style.width = (W*SC)+'px'; cv.style.height = innerHeight+'px'; cv.style.left = leftPx+'px';
  WX0 = 8; WX1 = W-8;
  Sc = mk(W,H); gS = Sc.getContext('2d');
  Lc = mk(W,H); gl = Lc.getContext('2d');
  Tc = mk(W,H); gT = Tc.getContext('2d');
  [gm,gS,gl,gT].forEach(c => c.imageSmoothingEnabled = false);
  buildInterior();
  segPx = Math.max(560, innerHeight*.9);
  $('#spacer').style.height = (segPx*(N-1) + innerHeight)+'px';
  layoutStops();
}

/* ---------------- drawing helpers ---------------- */
const R = (c,x,y,w,h) => { g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
function disc(cx,cy,r,c){ g.fillStyle = c; for (let y=-r;y<=r;y++){ const w = Math.round(Math.sqrt(r*r-y*y)); g.fillRect(Math.round(cx)-w,Math.round(cy)+y,w*2+1,1); } }
function bitmap(rows,x,y,c){ g.fillStyle = c; rows.forEach((row,j) => { for (let i=0;i<row.length;i++) if (row[i]==='X') g.fillRect(x+i,y+j,1,1); }); }
function cells(f,cw,seed,cb){ const sc = X*f, k0 = Math.floor(sc/cw)-1, k1 = Math.floor((sc+W)/cw)+1; for (let k=k0;k<=k1;k++) cb(k*cw-sc, hash(k*7.13+seed), k); }
const em = [];
const glow = (x,y,w,h,c,a=.25) => em.push([x,y,w,h,c,a]);

function tile(w,fn){ const c = mk(w,H), x = c.getContext('2d'); fn(x,w); return c; }
function ridge(w,base,amp,k1,k2,k3,col,top,ph=0){
  return tile(w,(x) => {
    for (let i=0;i<w;i++){
      const t = i/w*Math.PI*2;
      const y = Math.round(base - amp*(.5+.5*(Math.sin(t*k1+ph)*.5+Math.sin(t*k2+ph*2)*.3+Math.sin(t*k3+ph*3)*.2)));
      x.fillStyle = col; x.fillRect(i,y,1,HZ+10-y);
      if (top){ x.fillStyle = top; x.fillRect(i,y,1,2); }
    }
  });
}
function skyline(w,base,minH,maxH,col,seed,top){
  return tile(w,(x) => {
    let px = 0, k = 0;
    while (px < w){
      const bw = 7+Math.floor(hash(seed+k)*10), bh = minH+Math.floor(hash(seed+k*3.1)*(maxH-minH));
      const ww = Math.min(bw, w-px);
      x.fillStyle = col; x.fillRect(px,base-bh,ww,bh+8);
      if (top){ x.fillStyle = top; x.fillRect(px,base-bh,ww,1); }
      if (hash(seed+k*5.7) > .7){ x.fillStyle = col; x.fillRect(px+Math.floor(ww/2),base-bh-6,1,6); }

function buildTiles(){

        if (depth > 0){ x.fillStyle = '#f6f9ff'; x.fillRect(cx+i,y,1,Math.round(depth)); x.fillStyle = '#dbe6fb'; x.fillRect(cx+i,y+Math.round(depth)-1,1,1); }

  tiles.fuji = tile(640,(x) => { peak(x,120,22,80,'#9fb2da',false,HZ+2); peak(x,330,46,150,'#8aa0d4',true,HZ+2); peak(x,560,18,70,'#a5b7dd',false,HZ+2); });

  // sakura/temple hills
  tiles.m4a = tile(640,(x) => {

function openPanel(i){
  const s = ST[i], m = D.modules[i];
  $('#pnum').textContent = String(i+1).padStart(2,'0'); $('#ptitle').innerHTML = `${s.kana}<small>${s.ro} · ${m.title}</small>`;
  $('#psub').textContent = `${m.tag} · ${s.sub}`; $('#pbody').innerHTML = C.get(s.id); C.wire($('#pbody'));
  $('#panel').style.setProperty('--st',s.col);
  $('#pnext').textContent = i===N-1 ? '↺ ride back to the start' : `ride to ${ST[i+1].ro} ▸`;
  $('#pnext').dataset.i = i; showPanel();
}
function openPlain(){
  $('#pnum').textContent = '★'; $('#ptitle').innerHTML = 'Everything<small>plain text</small>'; $('#psub').textContent = 'all six stops on one long page';
  $('#pbody').innerHTML = ST.map((s,i) => `<section class="plainsec"><h3>${String(i+1).padStart(2,'0')} · ${D.modules[i].title}</h3>${C.get(s.id)}</section>`).join(''); C.wire($('#pbody'));
  $('#panel').style.setProperty('--st','#3fa796'); $('#pnext').dataset.i = -1; $('#pnext').textContent = 'close ✕'; showPanel();
}
function showPanel(){ panelOpen = true; $('#pbody').scrollTop = 0; $('#veil').classList.add('on'); $('#panel').classList.add('open'); document.documentElement.classList.add('lock'); beep(660,.08); }
function closePanel(){ panelOpen = false; $('#veil').classList.remove('on'); $('#panel').classList.remove('open'); document.documentElement.classList.remove('lock'); }

/* ---------------- riding ---------------- */
let ride = null;
function rideTo(i){
  i = clamp(i,0,N-1); const to = i*segPx, from = window.scrollY, d = Math.abs(to-from); if (d<2) return;
  closePanel();
  const dur = clamp(900+d*1.25,1400,4800), t0 = performance.now(), me = ride = {};
  (function step(now){ if (ride!==me) return; const u = clamp((now-t0)/dur,0,1), e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; window.scrollTo(0,from+(to-from)*e); if (u<1) requestAnimationFrame(step); else ride = null; })(performance.now());
}
['wheel','touchstart','keydown'].forEach(ev => addEventListener(ev,() => { if (ev!=='keydown') ride = null; },{ passive:true }));
addEventListener('scroll',() => { scrollY_ = window.scrollY; },{ passive:true });
let scrollY_ = 0;

/* ---------------- audio ---------------- */
let actx = null, on = false, rumble = null, clackT = 0;
function ac(){ if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return actx; }
function beep(f,d,v=.05,when=0){ if (!on||!ac()) return; const o = actx.createOscillator(), gn = actx.createGain(); o.type = 'sine'; o.frequency.value = f; const t = actx.currentTime+when; gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(v,t+.02); gn.gain.exponentialRampToValueAtTime(.0001,t+d+.5); o.connect(gn).connect(actx.destination); o.start(t); o.stop(t+d+.6); }
function chime(){ beep(784,.2,.06,0); beep(622,.3,.06,.28); beep(784,.2,.05,.7); }
function noiseBuf(){ const b = actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
function startRumble(){ if (rumble||!ac()) return; const s = actx.createBufferSource(); s.buffer = noiseBuf(); s.loop = true; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; const gn = actx.createGain(); gn.gain.value = 0; s.connect(f).connect(gn).connect(actx.destination); s.start(); rumble = gn; }
function clack(){ if (!on||!ac()) return; const s = actx.createBufferSource(); s.buffer = noiseBuf(); const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.4; const gn = actx.createGain(), t = actx.currentTime; gn.gain.setValueAtTime(.05,t); gn.gain.exponentialRampToValueAtTime(.0001,t+.07); s.connect(f).connect(gn).connect(actx.destination); s.start(t,Math.random()); s.stop(t+.1); }
$('#snd').addEventListener('click',() => { on = !on; $('#snd').textContent = on ? '♪ sound on' : '♪ sound off'; $('#snd').setAttribute('aria-pressed',on); if (on){ ac(); if (actx.state==='suspended') actx.resume(); startRumble(); beep(880,.1); } else if (rumble) rumble.gain.value = 0; });

/* ---------------- loop ---------------- */
let last = performance.now();
function tick(dt){
  if (!manual) target = mapScroll(scrollY_);
  const k = 1-Math.exp(-dt*5.2), nx = X+(target-X)*k, v = Math.abs(nx-X)/Math.max(dt,.001);
  X = nx; vs = vs*.82+v*.18; if (vs<1) vs = 0;
  if (on && rumble){ rumble.gain.value = clamp(vs/900,0,.16); clackT -= dt; if (vs>30 && clackT<=0){ clack(); clackT = clamp(.55-vs/1700,.12,.55); } }
}
function frame(now){ const dt = Math.min(.05,(now-last)/1000||.016); last = now; tick(dt); render(now/1000); updateUI(); requestAnimationFrame(frame); }

/* ---------------- events ---------------- */
$('#get').addEventListener('click',() => openPanel(at));
$('#x').addEventListener('click',closePanel); $('#veil').addEventListener('click',closePanel); $('#pback').addEventListener('click',closePanel);
$('#pnext').addEventListener('click',e => { const i = +e.currentTarget.dataset.i; if (i<0) closePanel(); else if (i===N-1) rideTo(0); else rideTo(i+1); });
$('#plain').addEventListener('click',openPlain);
$('#next').addEventListener('click',() => { if (at===N-1) rideTo(0); else rideTo(at>=0 ? at+1 : clamp(Math.ceil(X/SEG),0,N-1)); });
$('#prev').addEventListener('click',() => rideTo(at>=0 ? at-1 : clamp(Math.floor(X/SEG),0,N-1)));
$('#board').addEventListener('click',() => { $('#intro').classList.add('off'); beep(660,.1); });
addEventListener('keydown',e => {
  if (e.key==='Escape'){ if (panelOpen) closePanel(); return; }
  if (panelOpen || !$('#intro').classList.contains('off') && (e.key!=='Enter')) { if (e.key==='Enter' && !panelOpen){} else return; }
  if (e.target.matches('input,textarea')) return;
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); $('#next').click(); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); $('#prev').click(); }
  else if (e.key==='Enter' && at>=0){ openPanel(at); }
});
addEventListener('wheel',() => { if (!$('#intro').classList.contains('off')) $('#intro').classList.add('off'); },{ passive:true });
addEventListener('resize',() => { resize(); });

/* ---------------- boot ---------------- */
buildTiles(); resize();
const qs = new URLSearchParams(location.search);
if (qs.has('at')){ const i = clamp(+qs.get('at')||0,0,N-1); scrollTo(0,i*segPx); scrollY_ = i*segPx; X = target = mapScroll(i*segPx); $('#intro').classList.add('off'); }
if (qs.has('x')){ manual = true; X = target = +qs.get('x'); $('#intro').classList.add('off'); }
updateUI();
window.__t = { set(x,tm){ manual = true; X = target = x; vs = 0; render(tm||1.3); updateUI(); }, speed(v){ vs = v; }, open:openPanel, frame:(tm)=>{ render(tm); updateUI(); }, ST, SEG };
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

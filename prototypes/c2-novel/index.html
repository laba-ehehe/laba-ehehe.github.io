<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lan Anh · A Portfolio Visual Novel</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/content.css">
<style>
:root{--ink:#3d2a52;--pink:#ff8fc2;--pink2:#ffc4de;--lav:#b9a3f2;--cream:#fff9ff;
  --c-ink:#3d2a52;--c-mute:#8a74a8;--c-accent:#e0489a;--c-line:#e7d8fb;--c-card:#fff;--c-input:#fff;--c-chip-a:#ffd9ee;--c-chip-b:#d9ecff;--c-chip-c:#fff2b8;--c-chip-d:#d8f7e6;--c-chip-e:#eadcff;
  --c-font-h:'Mochiy Pop One',sans-serif;--c-font-b:'Zen Maru Gothic',sans-serif;--c-btn:#ff8fc2;--c-btn-ink:#3a1a4a;--c-radius:16px;--c-bullet:'♡'}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1b1030}
body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden}
.bgc{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;image-rendering:pixelated;opacity:0;transition:opacity 1.1s ease,filter 1.1s;will-change:transform,opacity}
.bgc.on{opacity:1}.bgc.out{filter:blur(2px) brightness(1.1)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,15,60,.55) 100%),linear-gradient(transparent 60%,rgba(40,15,60,.35))}
#tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;transition:background 1.2s}
#petals{position:absolute;inset:0;pointer-events:none}
/* sprite */
#sprite{position:absolute;bottom:17%;left:12%;z-index:5;transition:left .8s cubic-bezier(.2,.9,.2,1),opacity .5s,bottom .5s;will-change:transform}
#sprite .shadow{position:absolute;left:8%;right:8%;bottom:-3%;height:5%;border-radius:50%;background:rgba(30,10,50,.4);filter:blur(3px)}
#sprite img{display:block;image-rendering:pixelated;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 6px 10px rgba(30,10,50,.45));animation:idle 1.4s steps(1) infinite;transform-origin:50% 100%}
@keyframes idle{50%{transform:translateY(calc(var(--s)*-.5px)) scaleY(1.01)}}
#sprite.bounce img{animation:bounce .6s cubic-bezier(.3,.9,.4,1) 1,idle 1.4s steps(1) .6s infinite}
@keyframes bounce{0%{transform:scale(1.04,.92)}30%{transform:translateY(calc(var(--s)*-5px)) scale(.97,1.05)}60%{transform:scale(1.05,.92)}100%{transform:none}}
#sprite.shake img{animation:shake .5s linear 1,idle 1.4s steps(1) .5s infinite}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#sprite.in{animation:slidein .8s cubic-bezier(.2,.9,.2,1)}@keyframes slidein{from{opacity:0;transform:translateX(-30px)}}
#emote{position:absolute;left:62%;top:-4%;font:700 calc(var(--s)*4.2px)/1 'Mochiy Pop One';color:var(--pink);text-shadow:0 0 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 6px 14px rgba(30,10,50,.35);opacity:0;transform:scale(.4);pointer-events:none}
#emote.pop{animation:emote 1.3s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes emote{0%{opacity:0;transform:scale(.3) translateY(10px)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1) translateY(-6px)}100%{opacity:0;transform:scale(1) translateY(-18px)}}
/* HUD */
#hud{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#meta{display:flex;flex-direction:column;gap:6px}
#chap{font:700 13px 'Zen Maru Gothic';letter-spacing:.08em;color:#fff;background:rgba(61,42,82,.62);backdrop-filter:blur(6px);padding:6px 14px;border-radius:999px;align-self:flex-start;border:2px solid rgba(255,255,255,.4)}
#hearts{display:flex;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);align-self:flex-start;font-size:17px}
#hearts span{filter:grayscale(1) brightness(1.5);opacity:.55;transition:all .5s}#hearts span.on{filter:none;opacity:1;animation:hb 1s}
@keyframes hb{40%{transform:scale(1.6)}}
#menu{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.mb{padding:7px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,214,236,.88));font:700 13px 'Zen Maru Gothic';letter-spacing:.04em;color:#5a3a78;box-shadow:0 4px 0 rgba(120,60,150,.3);transition:transform .12s}
.mb:hover{transform:translateY(-2px)}.mb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,60,150,.3)}.mb.on{background:linear-gradient(180deg,#ffe3f0,#ff9fc8);color:#fff}
/* dialogue */
#box{position:absolute;left:50%;bottom:3.5%;width:min(1080px,94vw);transform:translateX(-50%);z-index:12;transition:opacity .35s,transform .35s}
#box.hide{opacity:0;transform:translate(-50%,16px);pointer-events:none}
#name{position:absolute;left:30px;top:-19px;padding:5px 22px 6px;border-radius:999px;background:linear-gradient(180deg,#ffb3d6,#ff7fb5);color:#fff;font:400 18px 'Mochiy Pop One';letter-spacing:.04em;border:3px solid #fff;box-shadow:0 5px 0 rgba(180,60,120,.35),0 0 20px rgba(255,143,194,.5);text-shadow:0 2px 0 rgba(160,40,100,.4)}
#name:empty{display:none}
#panel{position:relative;min-height:clamp(150px,25vh,230px);padding:30px 40px 26px;border-radius:26px;background:linear-gradient(180deg,rgba(255,252,255,.96),rgba(255,239,250,.93));border:4px solid #fff;box-shadow:0 0 0 3px #ffb3d6,0 18px 50px rgba(40,10,60,.5),inset 0 0 40px rgba(255,200,230,.35);cursor:pointer}
#panel::before,#panel::after{content:'✦';position:absolute;color:#ffb3d6;font-size:18px}#panel::before{left:12px;top:8px}#panel::after{right:14px;bottom:8px}
#text{font:500 clamp(17px,2.35vh,24px)/1.65 'Zen Maru Gothic';color:var(--ink);min-height:3.3em}
#text b{font-weight:900;color:#d2347f;background:linear-gradient(transparent 62%,#ffe3f0 62%)}
#text.narr{font-style:italic;color:#6a5a88}
#next{position:absolute;right:26px;bottom:12px;color:#ff6fae;font-size:22px;animation:nx .9s ease-in-out infinite;opacity:0}#next.on{opacity:1}
@keyframes nx{50%{transform:translateY(5px)}}
/* choices */
#choices{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:70px 20px 24px;pointer-events:none}
#choices.on{pointer-events:auto;background:radial-gradient(ellipse at center,rgba(40,15,60,.4),rgba(40,15,60,.65))}
#choices h2{margin:0 0 6px;font:400 clamp(22px,4vh,34px) 'Mochiy Pop One';color:#fff;text-shadow:0 3px 0 rgba(160,40,110,.6),0 0 24px rgba(255,143,194,.7);opacity:0}
.ch{display:flex;align-items:center;gap:14px;width:min(560px,90vw);padding:12px 24px 12px 14px;border-radius:999px;border:3px solid #fff;background:linear-gradient(180deg,#fff,#ffe3f2);box-shadow:0 6px 0 #ff9fc8,0 14px 30px rgba(40,10,60,.4);font:700 clamp(15px,2.2vh,19px) 'Zen Maru Gothic';color:#4a2a68;text-align:left;opacity:0;transform:translateY(16px) scale(.96);transition:transform .15s,box-shadow .15s,background .15s}
.ch i{font:900 15px 'Zen Maru Gothic';font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#ffb3d6,#ff6fae);flex:none}
.ch small{display:block;font:500 12px 'Zen Maru Gothic';color:#9a80b8;margin-top:1px}
.ch:hover,.ch:focus-visible{transform:translateY(-3px) scale(1.02);background:linear-gradient(180deg,#fff,#ffcfe8);outline:none}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #ff9fc8}
.ch.done{background:linear-gradient(180deg,#f3fff6,#d8f7e3);box-shadow:0 6px 0 #9fdcb4,0 14px 30px rgba(40,10,60,.4)}.ch.done i{background:linear-gradient(180deg,#a8e8bf,#5fcf8a)}
#choices.many{display:grid;grid-template-columns:repeat(2,min(470px,44vw));justify-content:center;align-content:center;gap:12px 18px;padding-top:64px}#choices.many h2{grid-column:1/-1;text-align:center}#choices.many .ch{width:auto;padding:10px 20px 10px 12px}
#choices.on h2,#choices.on .ch{animation:chin .45s cubic-bezier(.2,1.2,.4,1) forwards}@keyframes chin{to{opacity:1;transform:none}}
/* chapter card */
#card{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(255,200,230,.25),rgba(40,15,60,.8));opacity:0;pointer-events:none;transition:opacity .5s}
#card.on{opacity:1;pointer-events:auto}
#card small{font:700 14px 'Zen Maru Gothic';letter-spacing:.5em;color:#ffd1e8}#card h1{margin:10px 0;font:400 clamp(34px,8vh,70px) 'Mochiy Pop One';color:#fff;text-shadow:0 4px 0 rgba(160,40,110,.7),0 0 40px rgba(255,143,194,.8)}#card p{margin:0;font:700 clamp(15px,2.4vh,22px) 'Zen Maru Gothic';color:#ffd1e8;letter-spacing:.3em}
#card .line{width:min(380px,60vw);height:3px;margin:12px auto;background:linear-gradient(90deg,transparent,#ffb3d6,transparent)}
/* title */
#title{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:opacity .7s,transform .7s}
#title.gone{opacity:0;pointer-events:none;transform:scale(1.06)}
#title .t1{font:700 14px 'Zen Maru Gothic';letter-spacing:.55em;color:#fff;text-shadow:0 2px 8px rgba(60,20,90,.6)}
#title h1{margin:0;font:400 clamp(60px,15vh,150px)/.95 'Mochiy Pop One';background:linear-gradient(180deg,#fff,#ffd6ec 55%,#ff9fc8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #c4408a) drop-shadow(0 12px 22px rgba(90,20,110,.55));letter-spacing:.01em}
#title .t2{font:700 clamp(15px,2.4vh,22px) 'Zen Maru Gothic';color:#fff;letter-spacing:.25em;text-shadow:0 2px 10px rgba(60,20,90,.6);margin-bottom:12px}
#title .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.tb{width:min(280px,76vw);padding:13px 22px;border-radius:999px;border:3px solid #fff;background:linear-gradient(180deg,#fff,#ffd6ec);box-shadow:0 6px 0 #ff9fc8,0 14px 28px rgba(60,20,90,.4);font:700 18px 'Zen Maru Gothic';color:#4a2a68;transition:transform .15s}
.tb:hover{transform:translateY(-3px) scale(1.03)}.tb.sec{background:linear-gradient(180deg,#f6f0ff,#dccdf8);box-shadow:0 6px 0 #b9a3f2,0 14px 28px rgba(60,20,90,.4);font-size:15px;padding:10px 22px}
#title .foot{margin-top:14px;font:700 12px 'Zen Maru Gothic';letter-spacing:.2em;color:#fff;opacity:.85;text-shadow:0 2px 6px rgba(60,20,90,.7)}
/* overlays */
.ov{position:absolute;inset:0;z-index:40;display:none;place-items:center;padding:20px;background:rgba(40,15,60,.62);backdrop-filter:blur(5px)}.ov.on{display:grid}
.win{width:min(780px,100%);max-height:min(84dvh,760px);display:flex;flex-direction:column;border-radius:26px;background:var(--cream);border:4px solid #fff;box-shadow:0 0 0 3px #ffb3d6,0 24px 70px rgba(30,5,50,.6);overflow:hidden;animation:winin .35s cubic-bezier(.2,1.2,.4,1);-webkit-user-select:text;user-select:text}
@keyframes winin{from{opacity:0;transform:scale(.92)}}
.win header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(180deg,#ffd0ea,#ffa8d2);color:#fff;font:400 20px 'Mochiy Pop One';text-shadow:0 2px 0 rgba(160,40,110,.5)}
.win header span{flex:1}.win header button{border:3px solid #fff;background:#ff6fae;color:#fff;width:34px;height:34px;border-radius:50%;font:900 15px 'Zen Maru Gothic'}
.win .body{overflow:auto;padding:20px 24px 26px;font-size:15px;line-height:1.6;scrollbar-width:thin;scrollbar-color:#ffb3d6 transparent}
.logl{margin:0 0 10px;padding:10px 14px;border-radius:14px;background:#fff0f8}.logl b.n{display:block;font:400 13px 'Mochiy Pop One';color:#e0489a;margin-bottom:2px}.logl.nar{background:#f1ecff;font-style:italic}
.plain h3.sect{font:400 24px 'Mochiy Pop One';margin:26px 0 12px;color:#d2347f;padding-top:12px;border-top:3px dotted #ffc4de}.plain h3.sect:first-child{margin-top:0;border:0;padding:0}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:50;padding:8px 18px;border-radius:999px;background:rgba(61,42,82,.85);color:#fff;font:700 13px 'Zen Maru Gothic';opacity:0;transition:opacity .3s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:760px){#panel{padding:26px 22px 24px}#hud{top:8px;left:8px;right:8px}.mb{padding:6px 10px;font-size:12px}#name{left:18px;font-size:16px}#sprite{left:2%!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), D = C.D;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rndI = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ================= pixel-art backgrounds (320x180, drawn in code) ================= */
const W = 320, H = 180, BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const hexn = s => typeof s === 'number' ? s : parseInt(s.slice(1), 16), RGB = h => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function newC() { const c = document.createElement('canvas'); c.width = W; c.height = H; c.className = 'bgc'; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function grad(g, stops, y0 = 0, y1 = H, x0 = 0, x1 = W) { const w = x1 - x0, h = y1 - y0, img = g.createImageData(w, h), d = img.data, n = stops.length - 1, cols = stops.map(s => RGB(hexn(s)));
  for (let y = 0; y < h; y++) { const t = h > 1 ? y / (h - 1) * n : 0, i = Math.min(Math.floor(t), n - 1), f = t - i; for (let x = 0; x < w; x++) { const th = (BAY[(y + y0) & 3][(x + x0) & 3] + .5) / 16, c = cols[f > th ? i + 1 : i], k = (y * w + x) * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255; } } g.putImageData(img, x0, y0); }
const P = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const disc = (g, c, cx, cy, r) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .5) P(g, c, cx + x, cy + y); };
const glowD = (g, c, cx, cy, r, k = .9) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) { const d = Math.hypot(x, y) / r; if (d < 1 && BAY[(cy + y + 64) & 3][(cx + x + 64) & 3] / 16 < (1 - d) * (1 - d) * k) P(g, c, cx + x, cy + y); } };
const ridge = (g, c, base, fn, x0 = 0, x1 = W) => { for (let x = x0; x < x1; x++) { const h = Math.max(0, Math.round(fn(x))); P(g, c, x, base - h, 1, H - (base - h)); } };
const rect = (g, c, x, y, w, h) => P(g, c, x, y, w, h);
function cloud(g, x, y, s, light, shade) { [[0, 0, 6], [7, -3, 7], [15, 0, 6], [22, 1, 4]].forEach(([dx, dy, r]) => disc(g, shade, x + dx * s, y + dy * s + 1, r * s)); [[0, 0, 6], [7, -3, 7], [15, 0, 6], [22, 1, 4]].forEach(([dx, dy, r]) => disc(g, light, x + dx * s, y + dy * s, r * s)); }
function blossoms(g, x, y, n, spread, R, cols = ['#ffc6dc', '#ffdce9', '#ff9fc0', '#fff0f6']) { for (let i = 0; i < n; i++) { const a = R() * 6.28, d = Math.sqrt(R()) * spread; disc(g, cols[Math.floor(R() * cols.length)], x + Math.cos(a) * d * 1.3, y + Math.sin(a) * d * .8, 1 + Math.floor(R() * 3)); } }
function windowLights(g, x0, x1, base, R, col = '#ffe08a', p = .16) { for (let x = x0; x < x1; x += 3) for (let y = base - 36; y < base - 2; y += 3) if (R() < p) P(g, col, x, y, 1, 2); }
function skyline(g, base, color, R, minH, maxH, wMin, wMax, x0 = 0, x1 = W, lit = null, bt = H) { let x = x0; while (x < x1) { const w = wMin + Math.floor(R() * (wMax - wMin)), h = minH + Math.floor(R() * (maxH - minH)); P(g, color, x, base - h, w, h + (bt - base)); if (R() < .35 && bt === H) P(g, color, x + (w >> 1), base - h - 4, 1, 4); if (lit) for (let yy = base - h + 3; yy < base - 2; yy += 3) for (let xx = x + 1; xx < x + w - 1; xx += 3) if (R() < lit[1]) P(g, lit[0], xx, yy, 1, 2); x += w; } }
const woodFloor = (g, y0, c1, c2, seam, R) => { for (let y = y0; y < H; y++) { const row = Math.floor((y - y0) / 8) % 2; P(g, row ? c1 : c2, 0, y, W, 1); } for (let r = 0; r < Math.ceil((H - y0) / 8); r++) { const yy = y0 + r * 8; P(g, seam, 0, yy, W, 1); for (let x = (r % 2) * 36; x < W; x += 72) P(g, seam, x, yy, 1, 8); } };

const SC = {};
SC.title = () => { const [c, g] = newC(), R = rng(7); grad(g, ['#79c3ff', '#a6d6fb', '#e3e8ff', '#ffdbea', '#ffe6d2'], 0, 150); glowD(g, '#fff6d8', 232, 64, 70, .8); disc(g, '#fffbe8', 232, 64, 17); disc(g, '#fff1b8', 232, 64, 13);
  cloud(g, 40, 40, 2, '#ffffff', '#dfe6ff'); cloud(g, 150, 22, 1.4, '#ffffff', '#e6e6ff'); cloud(g, 258, 100, 1.8, '#fff4fa', '#ffd9ea'); cloud(g, 70, 96, 1.2, '#ffffff', '#ffe0f0');

function psz() { pw = pc.width = innerWidth; ph = pc.height = innerHeight; pet = Array.from({ length: Math.min(46, Math.round(pw / 30)) }, () => ({ x: Math.random() * pw, y: Math.random() * ph, s: 5 + Math.random() * 7, v: 18 + Math.random() * 30, sw: Math.random() * 6, r: Math.random() * 6 })); } psz(); addEventListener('resize', psz);
(function pl(t) { px.clearRect(0, 0, pw, ph); if (!reduce) { pet.forEach(p => { p.y += p.v * .016; p.x += Math.sin(t / 900 + p.sw) * .5 + .25; p.r += .02; if (p.y > ph + 10) { p.y = -10; p.x = Math.random() * pw; } if (p.x > pw + 10) p.x = -10; px.save(); px.translate(p.x, p.y); px.rotate(p.r); px.fillStyle = 'rgba(255,198,222,.8)'; px.beginPath(); px.ellipse(0, 0, p.s, p.s * .6, 0, 0, 7); px.fill(); px.restore(); }); } requestAnimationFrame(pl); })(0);

/* ================= the script (all facts from the resume) ================= */
const bold = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const CH = {
  profile: { n: 1, title: 'Hello!', jp: 'はじめまして', bg: 'cafe', pos: 'left', det: 'profile', lines: [
    { nar: 'A little café at golden hour. It smells like matcha and warm pastries. Someone waves from behind the counter.' },
    { t: "Hi hi! Welcome in~ I'm **Lan Anh**!", fx: 'bounce', em: '♪' },
    { t: "I'm studying **Computer Engineering** and **Economics** at the University of Florida. Class of 2027, with a 3.94 GPA." },
    { t: "I love building things where technical excellence meets human understanding." },
    { t: "Outside of code, I direct professional development at **UF Product Space**, run the awards for **WiNGHacks**, and TA data structures and digital logic." },
    { t: "Oh, and I'm a professional tech yapper. :D", fx: 'bounce', em: '✦' }] },
  skills: { n: 2, title: 'The Toolbox', jp: 'ツールボックス', bg: 'classroom', pos: 'right', det: 'skills', lines: [
    { nar: 'An empty classroom. Chalk dust drifts through the afternoon light.' },
    { t: "Ooh, you want to peek at my toolbox? Okay, let's go!", fx: 'bounce', em: '!' },
    { t: "Languages: **Python, C++, Java, JavaScript, TypeScript, Swift, SQL, R, MATLAB, SystemVerilog** and Assembly." },
    { t: "Frameworks: **FastAPI, Flask, Spring, React, React Native, Next.js, Express** and SwiftUI." },
    { t: "Tools: **Docker, Kubernetes, Kafka, AWS, GCP, Azure, MongoDB, Jenkins** and Bazel." },
    { t: "And for AI and ML: **Model Context Protocol, PyTorch, TensorFlow, OpenCV**, scikit-learn... plus a lot of Claude Code lately.", fx: 'bounce', em: '✧' }] },
  experience: { n: 3, title: 'Where I\'ve Been', jp: '経験', bg: 'rooftop', pos: 'left', det: 'experience', lines: [
    { nar: 'The rooftop at sunset. The whole city hums below.' },
    { t: "I've been really lucky to work on some cool stuff." },
    { t: "This past summer at **Intuit**, I architected an AI-powered identity lookup platform. Investigators find linked accounts and fraud history across six products **97% faster**.", fx: 'bounce', em: '!' },
    { t: "I also built an account-linking pipeline that processes **5,000+ sanctions alerts** every week." },
    { t: "Before that: product management at **M_Service (MoMo)** and **Nami Technology**, an engineering fellowship at **Uber**, and neuroscience research at **Fudan University**." },
    { t: "And since 2024 I've been a **teaching assistant** at UF, with course content I built reaching 1,200+ students." }] },
  projects: { n: 4, title: 'Things I Made', jp: '作ったもの', bg: 'desk', pos: 'right', det: 'projects', lines: [
    { nar: 'Late night. The monitors glow softly and a half-finished tea sits next to the keyboard.' },
    { t: "Okay okay, project time!", fx: 'bounce', em: '♪' },
    { t: "**transPEAKtation** won **1st place at ShellHacks**! It re-ranks routes before traffic builds up. Our transformer cut forecast error by 33%.", fx: 'bounce', em: '★' },
    { t: "I led a team of four, and a PPO load-balancer cut riders' trip time by up to **59%** in a simulated 7,000-vehicle exodus." },
    { t: "**ChompCourse** builds semester-by-semester course roadmaps for UF students. 100+ people tested it!" },
    { t: "And **SET Dumpy** is a trash-detecting robot we built with 27 teammates. It hit 90% navigation accuracy." }] },
  leadership: { n: 5, title: 'The Crew', jp: 'リーダーシップ', bg: 'plaza', pos: 'left', det: 'leadership', lines: [
    { nar: 'The campus plaza at midday. Banners flutter above a busy crowd.' },
    { t: "I love bringing people together!", fx: 'bounce', em: '♡' },
    { t: "At **UF Product Space** I direct professional development: six workshops for 100+ members, and a fellowship matching **40+ fellows with 6 startups**." },
    { t: "We delivered **14 company-approved projects** with 100% completion. I'm really proud of that one." },
    { t: "And with **WiNGHacks**, UF's first hackathon for women, nonbinary people and gender minorities, we hosted **120+ hackers**, over **$10,000** in prizes and 30+ judges." }] },
  contact: { n: 6, title: 'Say Hi', jp: 'お問い合わせ', bg: 'street', pos: 'right', det: 'contact', lines: [
    { nar: 'Dusk on a quiet street. The lamps flicker on one by one.' },
    { t: "Thanks for sticking around!", fx: 'bounce', em: '♡' },
    { t: "If you want to build something together, or just say hi, my inbox is always open." },
    { t: "Send me a letter, I promise I write back. ✦", fx: 'bounce', em: '✉' }] }
};
const ORDER = ['profile', 'skills', 'experience', 'projects', 'leadership', 'contact'];
const SUBS = { profile: 'Who are you?', skills: 'What can you do?', experience: 'Where have you worked?', projects: 'Show me what you built!', leadership: 'Do you lead things?', contact: 'How do I reach you?' };
const CHOICE_TITLE = { profile: 'Meet Lan Anh', skills: 'The toolbox', experience: 'The experience', projects: 'The projects', leadership: 'The crew', contact: 'Say hello' };

/* ================= engine ================= */
const S = { chap: null, queue: [], line: null, typing: false, full: '', timer: 0, auto: false, skip: false, log: [], visited: new Set(), mode: 'title', sound: false, ac: null, autoT: 0, ended: false };
const hearts = $('#hearts'); hearts.innerHTML = ORDER.map(() => '<span>💗</span>').join('');
const heartsUpdate = () => [...hearts.children].forEach((h, i) => h.classList.toggle('on', S.visited.has(ORDER[i])));
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function blip() { if (!S.sound) return; try { S.ac = S.ac || new (window.AudioContext || window.webkitAudioContext)(); const o = S.ac.createOscillator(), g = S.ac.createGain(); o.type = 'square'; o.frequency.value = 640 + Math.random() * 120; g.gain.setValueAtTime(.025, S.ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, S.ac.currentTime + .05); o.connect(g); g.connect(S.ac.destination); o.start(); o.stop(S.ac.currentTime + .05); } catch { } }
function chime() { if (!S.sound) return; try { S.ac = S.ac || new (window.AudioContext || window.webkitAudioContext)(); [784, 988, 1319].forEach((f, i) => { const o = S.ac.createOscillator(), g = S.ac.createGain(); o.type = 'sine'; o.frequency.value = f; const t = S.ac.currentTime + i * .09; g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.05, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .5); o.connect(g); g.connect(S.ac.destination); o.start(t); o.stop(t + .55); }); } catch { } }

const spriteEl = $('#sprite'), spr = $('#spr');
function layoutSprite(pos) { const sc = Math.max(4, Math.min(13, Math.floor(innerHeight * (innerHeight < 560 ? .46 : .52) / 44))); spr.style.width = 30 * sc + 'px'; spr.style.height = 44 * sc + 'px'; spriteEl.style.setProperty('--s', sc); const small = innerWidth < 760; spriteEl.style.left = pos === 'right' ? (small ? '48%' : '62%') : pos === 'center' ? '40%' : (small ? '2%' : '12%'); spriteEl.style.bottom = (small ? 26 : 17) + '%'; }
function fx(kind) { spriteEl.classList.remove('bounce', 'shake'); void spriteEl.offsetWidth; if (kind) spriteEl.classList.add(kind); }
function emote(e) { const el = $('#emote'); el.textContent = e; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
addEventListener('resize', () => layoutSprite(S.chap ? CH[S.chap].pos : 'left'));

function showBox(on) { $('#box').classList.toggle('hide', !on); }
function setLine(l) {
  S.line = l; const nm = l.nar ? '' : 'Lan Anh'; $('#name').textContent = nm; const txt = l.nar || l.t; const tEl = $('#text'); tEl.classList.toggle('narr', !!l.nar); S.full = bold(txt); tEl.innerHTML = ''; S.log.push({ n: nm, t: bold(txt), nar: !!l.nar });
  if (l.fx) fx(l.fx); if (l.em) setTimeout(() => emote(l.em), 250); $('#next').classList.remove('on'); S.typing = true; typeText(); }
function typeText() { const tEl = $('#text'), toks = S.full.match(/<\/?b>|[\s\S]/g) || []; let i = 0; clearInterval(S.timer); const speed = S.skip ? 3 : (reduce ? 1 : 22);
  S.timer = setInterval(() => { let shown = 0; while (i < toks.length && shown < 1) { const t = toks[i++]; if (t !== '<b>' && t !== '</b>') shown++; }
    let html = toks.slice(0, i).join(''); if ((html.match(/<b>/g) || []).length > (html.match(/<\/b>/g) || []).length) html += '</b>'; tEl.innerHTML = html; if (i % 2 === 0) blip(); if (i >= toks.length) { clearInterval(S.timer); finishTyping(); } }, speed); }
function finishTyping() { S.typing = false; $('#text').innerHTML = S.full; $('#next').classList.add('on'); if (S.auto || S.skip) { clearTimeout(S.autoT); S.autoT = setTimeout(advance, S.skip ? 140 : 1500 + S.full.length * 14); } }
function advance() { if (S.mode === 'choice' || S.mode === 'title' || $('.ov.on') || $('#card').classList.contains('on')) return; if (S.typing) { clearInterval(S.timer); finishTyping(); return; } clearTimeout(S.autoT); const l = S.queue.shift(); if (l) { setLine(l); return; } endChapter(); }

function card(n, title, jp, done) { $('#cs').textContent = n ? 'CHAPTER ' + n : ''; $('#ct').textContent = title; $('#cj').textContent = jp; $('#card').classList.add('on'); chime(); setTimeout(() => { $('#card').classList.remove('on'); setTimeout(done, 450); }, reduce ? 300 : 1900); }
function startChapter(id) { const c = CH[id]; S.chap = id; S.mode = 'story'; S.queue = c.lines.slice(); S.ended = false; hideChoices(); showBox(false); $('#chap').textContent = `Ch.${c.n} · ${c.title}`; spriteEl.style.opacity = 0;
  card(c.n, c.title, c.jp, () => { setBg(c.bg); layoutSprite(c.pos); spriteEl.classList.remove('in'); void spriteEl.offsetWidth; spriteEl.classList.add('in'); spriteEl.style.opacity = 1; showBox(true); S.visited.add(id); heartsUpdate(); advance(); }); }
function endChapter() { if (S.ended) return; S.ended = true; S.mode = 'choice'; if (S.ending) { S.ending = false; showChoices('Thanks for reading ♡', [{ k: 'detc', label: 'Send Lan Anh a letter', sub: 'open the contact form' }, { k: 'res', label: 'Download resume' }, { k: 'hub', label: 'Back to chapter select' }]); return; } const id = S.chap, i = ORDER.indexOf(id), nx = ORDER[i + 1]; $('#next').classList.remove('on');
  const opts = [{ k: 'det', label: 'Show me the details', sub: 'the full write-up' }]; if (nx) opts.push({ k: 'go', id: nx, label: 'Next: ' + CH[nx].title, sub: CH[nx].jp }); opts.push({ k: 'hub', label: 'Back to chapter select' }); showChoices(CHOICE_TITLE[id] + ' · what next?', opts); }
function hub(first) { S.mode = 'choice'; S.chap = 'hub'; $('#chap').textContent = 'Chapter select'; setBg('cafe'); layoutSprite('left'); spriteEl.style.opacity = 1; spriteEl.classList.remove('in'); void spriteEl.offsetWidth; spriteEl.classList.add('in'); showBox(false);
  const all = S.visited.size >= ORDER.length; const opts = ORDER.map(id => ({ k: 'go', id, label: CH[id].title, sub: SUBS[id], num: CH[id].n, done: S.visited.has(id) })); opts.push({ k: 'plain', label: 'Read the plain version', sub: 'everything on one page' }); opts.push({ k: 'res', label: 'Download resume' });
  if (all && !hub.ended) { hub.ended = true; trueEnding(); return; } showChoices(all ? '★ Thanks for reading it all ★' : 'Where to next?', opts); }
function trueEnding() { S.mode = 'story'; S.ending = true; S.ended = false; S.queue = [{ nar: "You've read every chapter. The café is quiet now, just the soft hum of the espresso machine." }, { t: "You read the whole thing?! Okay, you're officially my favorite person today. ♡", fx: 'bounce', em: '♡' }, { t: "If you think we'd work well together, let's talk. I'd love to hear what you're building.", fx: 'bounce', em: '✦' }]; showBox(true); advance(); }

function showChoices(title, opts) { const el = $('#choices'); [...el.querySelectorAll('.ch')].forEach(b => b.remove()); $('#chq').textContent = title; showBox(false);
  opts.forEach((o, i) => { const b = document.createElement('button'); b.className = 'ch' + (o.done ? ' done' : ''); b.style.animationDelay = (.08 + i * .06) + 's'; b.innerHTML = `<i>${o.num || i + 1}</i><span>${o.label}${o.sub ? `<small>${o.sub}</small>` : ''}</span>`; b.onclick = () => pickChoice(o); el.appendChild(b); o.btn = b; }); el.classList.toggle('many', opts.length > 5); el.classList.add('on'); S.opts = opts; }
function hideChoices() { $('#choices').classList.remove('on'); }
function pickChoice(o) { chime(); if (o.k === 'go') { hideChoices(); startChapter(o.id); } else if (o.k === 'det') { openDetails(S.chap); } else if (o.k === 'detc') openDetails('contact'); else if (o.k === 'hub') { hideChoices(); hub(); } else if (o.k === 'plain') openPlain(); else if (o.k === 'res') { const a = document.createElement('a'); a.href = '/assets/Lan-Anh-Do-Resume.pdf'; a.download = 'Lan-Anh-Do-Resume.pdf'; a.click(); toast('Resume downloaded ♡'); } }

/* overlays */
const ovs = ['#ovLog', '#ovDet', '#ovPlain'];
function openOv(id) { ovs.forEach(o => $(o).classList.remove('on')); $(id).classList.add('on'); S.auto && toggleAuto(); }
function closeOv() { ovs.forEach(o => $(o).classList.remove('on')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeOv); ovs.forEach(o => $(o).addEventListener('pointerdown', e => { if (e.target === $(o)) closeOv(); }));
function openDetails(id) { $('#detT').textContent = '📖 ' + CH[id].title + ' · ' + CH[id].jp; $('#detBody').innerHTML = C.get(CH[id].det); C.wire($('#detBody')); openOv('#ovDet'); $('#detBody').scrollTop = 0; }
function openLog() { $('#logBody').innerHTML = S.log.slice(-60).map(l => `<div class="logl ${l.nar ? 'nar' : ''}">${l.n ? `<b class="n">${l.n}</b>` : ''}${l.t}</div>`).join('') || '<p>Nothing yet.</p>'; openOv('#ovLog'); const b = $('#logBody'); b.scrollTop = b.scrollHeight; }
function openPlain() { $('#plainBody').innerHTML = ORDER.map(id => `<h3 class="sect">${CH[id].title} <small style="font:500 13px 'Zen Maru Gothic';color:#9a80b8">${CH[id].jp}</small></h3>${C.get(CH[id].det)}`).join(''); C.wire($('#plainBody')); openOv('#ovPlain'); $('#plainBody').scrollTop = 0; }

/* HUD buttons */
function toggleAuto() { S.auto = !S.auto; $('#bAuto').classList.toggle('on', S.auto); if (S.auto) { S.skip = false; $('#bSkip').classList.remove('on'); if (!S.typing) advance(); } else clearTimeout(S.autoT); toast(S.auto ? 'Auto mode on' : 'Auto mode off'); }
function toggleSkip() { S.skip = !S.skip; $('#bSkip').classList.toggle('on', S.skip); if (S.skip) { S.auto = false; $('#bAuto').classList.remove('on'); if (!S.typing) advance(); else { clearInterval(S.timer); finishTyping(); } } toast(S.skip ? 'Skipping…' : 'Skip off'); }
$('#bAuto').onclick = toggleAuto; $('#bSkip').onclick = toggleSkip; $('#bLog').onclick = openLog; $('#bDet').onclick = () => { if (S.chap && CH[S.chap]) openDetails(S.chap); else toast('Pick a chapter first ♡'); };
$('#bSnd').onclick = () => { S.sound = !S.sound; $('#bSnd').textContent = S.sound ? '♪ on' : '♪ off'; $('#bSnd').classList.toggle('on', S.sound); chime(); };
$('#bHome').onclick = () => { clearTimeout(S.autoT); clearInterval(S.timer); S.auto = S.skip = false; $('#bAuto').classList.remove('on'); $('#bSkip').classList.remove('on'); closeOv(); showBox(false); hideChoices(); hub(); };
$('#panel').onclick = advance;
addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'Escape') { closeOv(); return; } if ($('.ov.on')) return;
  if (S.mode === 'choice') { const n = parseInt(e.key); if (n >= 1 && S.opts && S.opts[n - 1]) pickChoice(S.opts[n - 1]); return; }
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advance(); } else if (e.key.toLowerCase() === 'a') toggleAuto(); else if (e.key.toLowerCase() === 's') toggleSkip(); else if (e.key.toLowerCase() === 'l') openLog(); });
addEventListener('click', e => { if (e.target.closest('#panel')) return; if (S.mode === 'story' && !e.target.closest('#hud,#choices,.ov,#card')) advance(); });

/* title */
function boot() { setBg('title'); layoutSprite('left'); spriteEl.style.opacity = 1; }
$('#tStart').onclick = () => { $('#title').classList.add('gone'); $('#hud').style.opacity = 1; chime(); hub.ended = false; setTimeout(() => startChapter('profile'), 350); };
$('#tChap').onclick = () => { $('#title').classList.add('gone'); $('#hud').style.opacity = 1; chime(); setTimeout(() => hub(), 300); };
$('#tPlain').onclick = openPlain;
boot();
const h0 = location.hash.slice(1); if (CH[h0]) { setTimeout(() => { $('#title').classList.add('gone'); $('#hud').style.opacity = 1; startChapter(h0); }, 400); }
})();
</script>

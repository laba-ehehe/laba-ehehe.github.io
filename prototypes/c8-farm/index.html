<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lan Anh · The Farm</title>
<link rel="icon" href="/assets/img/avatar.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/content.css">
<style>
:root{--wood:#b9763c;--wood2:#8a5428;--wood3:#d99a5a;--paper:#fbe3b0;--paper2:#f3cf8c;--ink:#4a2e18;--gold:#ffd24a;
  --c-ink:#4a2e18;--c-mute:#8a6a48;--c-accent:#c0502a;--c-line:#d9b27a;--c-card:#fff3d4;--c-input:#fff8e6;--c-chip-a:#ffd9c0;--c-chip-b:#d4ecb8;--c-chip-c:#ffe9a0;--c-chip-d:#cfe4f2;--c-chip-e:#f0d6ee;
  --c-font-h:'Pixelify Sans',sans-serif;--c-font-b:'Zen Maru Gothic',sans-serif;--c-btn:#c0502a;--c-btn-ink:#fff;--c-radius:6px;--c-bullet:'◆'}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a3a2a;font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;display:block}
.frame{background:var(--paper);border:4px solid var(--wood2);border-radius:8px;box-shadow:inset 0 0 0 3px var(--wood3),inset 0 0 0 5px var(--wood2),0 4px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.35)}
.wood{background:linear-gradient(var(--wood3),var(--wood));border:4px solid var(--wood2);border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.3),0 8px 14px rgba(0,0,0,.3);color:#fff8e0;text-shadow:0 2px 0 rgba(60,30,10,.6)}
#hud-l{position:fixed;left:12px;top:12px;z-index:5;padding:8px 12px 8px 10px;display:grid;gap:5px;font:700 15px 'Pixelify Sans';min-width:190px}
#hud-l .t{display:flex;align-items:center;gap:8px;font-size:17px}
#hud-l .st{display:flex;gap:12px;font-size:15px;align-items:center}
#hud-l canvas,#clock canvas{image-rendering:pixelated}
#clock{position:fixed;right:12px;top:12px;z-index:5;width:218px;padding:10px 12px 10px;display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
#dial{position:relative;width:62px;height:62px;border-radius:50%;background:conic-gradient(from 0deg,#2c3060 0 20%,#ffb86b 20% 27%,#9fdcff 27% 72%,#ff9a6b 72% 80%,#2c3060 80% 100%);border:3px solid var(--wood2);box-shadow:inset 0 0 0 2px #fff8e0,0 2px 0 rgba(0,0,0,.3)}
#dial i{position:absolute;left:50%;top:50%;width:3px;height:25px;margin-left:-1.5px;margin-top:-25px;background:#fff8e0;border-radius:2px;transform-origin:50% 100%;box-shadow:0 0 0 1px var(--wood2)}
#dial::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--wood2)}
#clock .tx{font:700 14px/1.25 'Pixelify Sans';text-align:center;white-space:nowrap}#clock .tm{font-size:19px;color:#ffe9a0}
#hotbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:flex;gap:3px;padding:6px;max-width:98vw}
.slot{position:relative;width:46px;height:46px;border-radius:6px;background:rgba(80,40,10,.35);box-shadow:inset 0 2px 0 rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .12s}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot b{position:absolute;left:3px;top:1px;font:700 11px 'Pixelify Sans';color:#fff3c8;text-shadow:0 1px 0 #3a1c08}
.slot:hover{transform:translateY(-3px)}
.slot.sel{box-shadow:inset 0 2px 0 rgba(0,0,0,.35),0 0 0 3px var(--gold),0 0 12px rgba(255,210,74,.7);background:rgba(255,220,120,.35)}
.slot.sep{margin-left:8px}
#tip{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:6;font:700 14px 'Pixelify Sans';padding:5px 14px;border-radius:6px;background:rgba(40,22,8,.78);color:#fff3c8;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#tip.on{opacity:1}
#help{position:fixed;left:12px;bottom:12px;z-index:4;font:700 12px 'Pixelify Sans';color:#fff3c8;text-shadow:0 1px 0 #000;opacity:.9;max-width:230px;line-height:1.5}
kbd{display:inline-block;background:#fff3c8;color:var(--ink);border-radius:4px;padding:0 5px;border-bottom:3px solid #c9a064;font:700 11px 'Pixelify Sans';text-shadow:none}
#prompt{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-100%);padding:5px 12px;font:700 14px 'Pixelify Sans';white-space:nowrap;display:none;border-radius:8px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
#prompt::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--wood2);border-bottom:0}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-30px);z-index:20;padding:8px 18px;font:700 16px 'Pixelify Sans';opacity:0;transition:.4s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.say{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-100%);background:#fff;border:3px solid var(--ink);border-radius:8px;padding:3px 9px;font:700 13px 'Pixelify Sans';white-space:nowrap;animation:up 1.3s ease-out forwards}
@keyframes up{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-14px}}

/* dialog */
#veil{position:fixed;inset:0;z-index:30;background:rgba(20,10,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#veil.on{opacity:1;pointer-events:auto}
#dlg{position:fixed;left:50%;top:50%;z-index:31;width:min(900px,95vw);max-height:90vh;display:flex;flex-direction:column;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s;overflow:hidden}
#dlg.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dh{display:flex;gap:14px;align-items:center;padding:14px 18px;background:linear-gradient(var(--wood3),var(--wood));border-bottom:4px solid var(--wood2);color:#fff8e0;text-shadow:0 2px 0 rgba(60,30,10,.6);position:relative}
.dh .pt{width:78px;height:78px;border-radius:8px;background:linear-gradient(#bfe6ff,#e7f6d8);border:4px solid var(--wood2);overflow:hidden;display:grid;place-items:end center;flex:none;box-shadow:inset 0 0 0 2px #fff8e0}
.dh .pt canvas{width:60px;height:66px;image-rendering:pixelated;margin-bottom:-14px}
.dh h2{margin:0;font:700 28px/1.1 'Pixelify Sans'}.dh p{margin:4px 0 0;font:700 14px 'Zen Maru Gothic';color:#ffeab8;text-shadow:none;max-width:560px}
.dx{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:6px;background:#d9503a;border:3px solid #fff3c8;color:#fff;font:700 18px 'Pixelify Sans';box-shadow:0 3px 0 rgba(0,0,0,.3)}.dx:hover{background:#ef6a52}
.db{overflow:auto;padding:18px 22px;font-size:15px;line-height:1.55;flex:1;overscroll-behavior:contain;background:repeating-linear-gradient(var(--paper) 0 28px,#f7d99e 28px 29px)}
.db .c-item,.db .c-proj,.db .c-edu{box-shadow:0 3px 0 #d9b27a;border-width:3px}
.db .c-btn{font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.dh+.db::-webkit-scrollbar{width:10px}.db::-webkit-scrollbar-thumb{background:var(--wood);border-radius:5px}
.df{display:flex;justify-content:space-between;gap:8px;padding:10px 18px;background:var(--paper2);border-top:4px solid var(--wood2);flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:6px;background:var(--wood);color:#fff8e0;border:3px solid var(--wood2);font:700 15px 'Pixelify Sans';box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(60,30,10,.5)}
.btn:hover{background:var(--wood3)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
#jrn{position:fixed;left:50%;top:50%;z-index:31;width:min(430px,94vw);transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s;padding:0;overflow:hidden}
#jrn.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#jrn h3{margin:0;padding:12px 18px;font:700 22px 'Pixelify Sans';background:linear-gradient(var(--wood3),var(--wood));color:#fff8e0;text-shadow:0 2px 0 rgba(60,30,10,.6);border-bottom:4px solid var(--wood2)}
#jrn ul{list-style:none;margin:0;padding:12px 16px;display:grid;gap:8px}
#jrn li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff3d4;border:3px solid #d9b27a;border-radius:6px;font-weight:900;font-size:14px}
#jrn li .ck{width:24px;height:24px;border-radius:5px;border:3px solid var(--wood2);background:#fff8e6;display:grid;place-items:center;font-size:15px;flex:none;color:#3c9a3c}
#jrn li small{display:block;font-weight:700;color:var(--c-mute);font-size:12px}
#jrn li .btn{margin-left:auto;padding:4px 10px;font-size:13px}
#jrn .f{padding:0 16px 14px;text-align:right}
@media(max-width:700px){.slot{width:34px;height:34px}.slot canvas{width:24px;height:24px}.slot b{display:none}#hotbar{gap:2px;padding:4px}.slot.sep{margin-left:4px}#help{display:none}#clock{width:132px;grid-template-columns:44px 1fr}#dial{width:44px;height:44px}#dial i{height:18px;margin-top:-18px}#hud-l{min-width:0}.dh h2{font-size:21px}.dh .pt{width:56px;height:56px}.dh .pt canvas{width:44px;height:48px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud-l" class="wood"><div class="t"><canvas id="seasonic" width="16" height="16" style="width:22px;height:22px"></canvas><span id="locn">Lan Anh's Farm</span></div>
  <div class="st"><span><canvas id="coinic" width="12" height="12" style="width:16px;height:16px;vertical-align:-2px"></canvas> <b id="coins">0</b></span><span><canvas id="berryic" width="12" height="12" style="width:16px;height:16px;vertical-align:-2px"></canvas> <b id="berries">0</b></span><span><canvas id="mapic" width="12" height="12" style="width:16px;height:16px;vertical-align:-2px"></canvas> <b id="vis">0</b>/6</span></div></div>
<div id="clock" class="wood"><div id="dial"><i id="hand"></i></div><div class="tx"><div id="cday">Spring 1</div><div class="tm" id="ctime">10:00 am</div></div></div>
<div id="tip"></div>
<div id="help"><kbd>WASD</kbd>/<kbd>arrows</kbd> walk · <kbd>click</kbd> go there<br><kbd>E</kbd> open a building · <kbd>1-4</kbd> farm tools · <kbd>J</kbd> journal</div>
<div id="prompt" class="wood"><kbd>E</kbd> <span id="pname"></span></div>
<div id="toast" class="frame"></div>
<div id="hotbar" class="wood"></div>

<div id="veil"></div>
<section id="dlg" class="frame" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dh"><div class="pt"><canvas id="port" width="30" height="33"></canvas></div><div><h2 id="dtitle"></h2><p id="dsay"></p></div><button class="dx" id="dx" aria-label="Close">✕</button></div>
  <div class="db" id="db"></div>
  <div class="df"><button class="btn" id="dclose">Back to the farm (Esc)</button><button class="btn" id="dnext">Walk to next place ▸</button></div>
</section>
<section id="jrn" class="frame" role="dialog" aria-label="Journal"><h3>📖 Farm Journal</h3><ul id="jl"></ul><div class="f"><button class="btn" id="jx">Close (J)</button></div></section>

<script src="/shared/data.js"></script>
<script src="/shared/content.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const D = window.PORTFOLIO, C = window.C;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const hash = n => { n = Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); };
const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hexA = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const mixA = (a,b,t) => a.map((v,i) => v+(b[i]-v)*t);
const css = a => `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;

/* ================= world constants ================= */
const TS = 24, MW = 44, MH = 30;
const SEAS = [
  { name:'Spring', grass:['#7fcf6a','#74c55f','#8bd876'], tuft:'#5eb050', flower:['#ffd1e6','#fff2a8','#ffffff','#c9b6ff'], tree:['#ff9fc4','#ffb8d3','#ff86b4'], trunk:'#7a5238', water:['#6ec6ea','#8fd8f2'], leaf:'#ffc2d8', path:['#d9c9a4','#c7b58a','#b8a67c'] },
  { name:'Summer', grass:['#5fc14f','#55b645','#6bcc5a'], tuft:'#3f9a3f', flower:['#ffe45c','#ff8a5c','#ffffff','#7fd8ff'], tree:['#3fa046','#4fb356','#368c3f'], trunk:'#6e4a30', water:['#53bfe8','#7bd4f2'], leaf:'#fff3a0', path:['#e0cfa6','#cdb98c','#bda97c'] },
  { name:'Fall',   grass:['#c4b95a','#b6ab4e','#cec66a'], tuft:'#9a8f3c', flower:['#ff9f4a','#ffd24a','#c4553a','#fff2c8'], tree:['#f0883a','#e0a53a','#c4553a'], trunk:'#6e4a30', water:['#5eb0d0','#7ec6e0'], leaf:'#f08a3a', path:['#cfba92','#bda57a','#ac9468'] },
  { name:'Winter', grass:['#e6f0f8','#dce9f4','#f2f8fc'], tuft:'#bcd0e4', flower:['#ffffff','#d8ecff','#ffffff','#ffffff'], tree:['#e8f1f8','#d8e6f0','#f4f9fc'], trunk:'#5e4638', water:['#8fc6e6','#b4dcf0'], leaf:'#ffffff', path:['#d8d4d0','#c6c2c0','#b8b4b2'], snow:true }
];
const PLACES = [
  { id:'profile',    name:'Farmhouse',        title:'Profile',    fx:5,  fy:5,  fw:6, fh:4, dx:8,  dy:9,  say:"Welcome to my farm! Make yourself at home." },
  { id:'skills',     name:'Greenhouse',       title:'Skills',     fx:15, fy:4,  fw:6, fh:4, dx:18, dy:8,  say:"Everything I've learned grows in here." },
  { id:'experience', name:'Market Hall',      title:'Experience', fx:25, fy:4,  fw:8, fh:4, dx:29, dy:8,  say:"Six stalls, six places I've worked." },
  { id:'projects',   name:'Workshop',         title:'Projects',   fx:34, fy:8,  fw:6, fh:4, dx:37, dy:12, say:"The tinkering happens here. Mind the sparks!" },
  { id:'leadership', name:'Community Center', title:'Leadership', fx:33, fy:18, fw:8, fh:5, dx:37, dy:23, say:"We build things better together." },
  { id:'contact',    name:'Post Office',      title:'Contact',    fx:18, fy:21, fw:5, fh:4, dx:20, dy:25, say:"Send me a letter! I always write back." }
];
const PLOTS_X0 = 6, PLOTS_Y0 = 13;

const S = { season:0, min:10*60, day:1, speed:1, sel:0, coins:0, berries:0, visited:new Set(), sound:false, open:null, jrn:false, f:0, t:0 };
try { const v = JSON.parse(localStorage.getItem('lanfarm')||'{}'); (v.vis||[]).forEach(i => S.visited.add(i)); S.coins = v.coins||0; S.berries = v.berries||0; } catch(e){}
const save = () => { try { localStorage.setItem('lanfarm',JSON.stringify({ vis:[...S.visited], coins:S.coins, berries:S.berries })); } catch(e){} };

/* ================= canvas / camera ================= */
const cv = $('#cv'), g = cv.getContext('2d', { alpha:false });
let VW = 380, VH = 214, SC = 4;
const cam = { x:0, y:0 };
function resize(){
  SC = Math.max(2,Math.round(innerHeight/270)); if (innerWidth<700) SC = Math.max(2,Math.round(innerHeight/300));
  VW = Math.ceil(innerWidth/SC); VH = Math.ceil(innerHeight/SC);
  cv.width = VW; cv.height = VH; cv.style.width = VW*SC+'px'; cv.style.height = VH*SC+'px'; g.imageSmoothingEnabled = false;
}

/* ================= map grid ================= */
const solid = new Uint8Array(MW*MH), pathT = new Uint8Array(MW*MH), waterT = new Uint8Array(MW*MH), resv = new Uint8Array(MW*MH);
const idx = (x,y) => y*MW+x;
function fillRectT(arr,x,y,w,h,v=1){ for (let j=y;j<y+h;j++) for (let i=x;i<x+w;i++) if (i>=0&&j>=0&&i<MW&&j<MH) arr[idx(i,j)] = v; }
function carve(pts){
  for (let k=0;k<pts.length-1;k++){
    const [ax,ay] = pts[k], [bx,by] = pts[k+1];
    const sx = Math.sign(bx-ax), sy = Math.sign(by-ay); let x = ax, y = ay;
    while (true){ fillRectT(pathT,x,y,2,2); fillRectT(resv,x-1,y-1,4,4); if (x===bx && y===by) break; if (x!==bx) x += sx; else y += sy; }
  }
}
// plaza
fillRectT(pathT,19,12,7,6); fillRectT(resv,18,11,9,8);
carve([[8,9],[8,10],[19,10],[19,12]]);
carve([[18,8],[18,10]]);
carve([[29,8],[29,10],[25,10],[25,12]]);
carve([[37,12],[37,14],[26,14]]);
carve([[37,23],[37,25],[30,25],[30,16],[26,16]]);
carve([[20,25],[20,27],[16,27],[16,17],[19,17]]);
// buildings
PLACES.forEach(p => { fillRectT(solid,p.fx,p.fy,p.fw,p.fh); fillRectT(resv,p.fx-1,p.fy-3,p.fw+2,p.fh+4); });
// pond
const POND = []; for (let j=19;j<=27;j++) for (let i=3;i<=11;i++){ const dx = (i-7)/4.6, dy = (j-23)/4.8; if (dx*dx+dy*dy<=1.0+((hash(i*3+j)>.5)?.08:-.06)) POND.push([i,j]); }
POND.forEach(([i,j]) => { waterT[idx(i,j)] = 1; solid[idx(i,j)] = 1; });
fillRectT(solid,10,22,3,1,0); // dock walkable
fillRectT(resv,2,18,11,11);
// plot field + fence
fillRectT(resv,4,11,9,6);
const FENCE = []; for (let i=5;i<=12;i++){ FENCE.push([i,12],[i,16]); } for (let j=13;j<=15;j++){ FENCE.push([5,j],[12,j]); }
const fenceSet = new Set(FENCE.map(([i,j]) => i+','+j));
FENCE.forEach(([i,j]) => { if (!(j===12 && (i===8||i===9))) solid[idx(i,j)] = 1; });
// lamp posts
const LAMPS = [[18,11],[26,11],[18,18],[26,18],[8,11],[30,9]];
LAMPS.forEach(([i,j]) => { solid[idx(i,j)] = 1; });
// trees
const TREES = [];
for (let j=0;j<MH;j++) for (let i=0;i<MW;i++){
  if (solid[idx(i,j)] || pathT[idx(i,j)] || resv[idx(i,j)] || waterT[idx(i,j)]) continue;
  const edge = i<3||j<2||i>MW-4||j>MH-3, r = hash(i*13.7+j*7.3);
  if ((edge && r<.7) || (!edge && r<.045)){ TREES.push({ i,j,sz:r<.2?2:1,v:Math.floor(hash(i+j*3.1)*3) }); solid[idx(i,j)] = 1; }
}
// remove neighbours too tightly packed? keep dense forest edge intentionally
// flowers / rocks / bushes
const DECOR = [];
for (let j=0;j<MH;j++) for (let i=0;i<MW;i++){ if (solid[idx(i,j)]||pathT[idx(i,j)]||waterT[idx(i,j)]) continue; const r = hash(i*5.9+j*11.1); if (r>.955) DECOR.push({ i,j,k:'bush' }); else if (r>.93 && !resv[idx(i,j)]) DECOR.push({ i,j,k:'rock' }); }
// plots
const PLOTS = []; for (let j=0;j<2;j++) for (let i=0;i<6;i++) PLOTS.push({ i:PLOTS_X0+i, j:PLOTS_Y0+j, st:0, stage:-1, wet:false, t:0 });
// mailbox + signs
const MAILBOX = { i:19, j:25 };
solid[idx(MAILBOX.i,MAILBOX.j)] = 1;
// well
fillRectT(solid,14,14,1,1);

/* ================= sprites (per season) ================= */
const SP = {};
const R = (c,col,x,y,w,h) => { c.fillStyle = col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
function disc(c,cx,cy,r,col){ c.fillStyle = col; for (let y=-r;y<=r;y++){ const w = Math.round(Math.sqrt(r*r-y*y)); c.fillRect(cx-w,cy+y,w*2+1,1); } }
function shingles(c,x0,y0,botW,h,topW,col1,col2){
  for (let r=0;r<h;r++){
    const t = r/(h-1), w = Math.round(topW+(botW-topW)*t), x = x0+Math.round((botW-w)/2);
    R(c,(r%8<4)?col1:col2,x,y0+r,w,1);
    if (r%8===0){ R(c,'rgba(0,0,0,.18)',x,y0+r,w,1); }

function update(dt){

  // movement

    let vx = (keys.right?1:0)-(keys.left?1:0), vy = (keys.down?1:0)-(keys.up?1:0);
    if (vx||vy){ P.path = null; P.pend = null; const l = Math.hypot(vx,vy); vx /= l; vy /= l; }
    else if (P.path && P.path.length){ const [tx,ty] = P.path[0], cx = (tx+.5)*TS, cy = (ty+.5)*TS+4, dx = cx-P.x, dy = cy-P.y, d = Math.hypot(dx,dy); if (d<2.5){ P.path.shift(); if (!P.path.length){ P.path = null; if (P.pend){ const pe = P.pend; P.pend = null; pe(); } } } else { vx = dx/d; vy = dy/d; } }
    const sp = 74;

  if (MW*TS<VW) cam.x = (MW*TS-VW)/2; if (MH*TS<VH) cam.y = (MH*TS-VH)/2;

function icon(id,fn,w=16){ const c = $(id), x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height); fn((col,a,b,ww,h) => { x.fillStyle = col; x.fillRect(a,b,ww,h); }); }
const ICONS = {
  hoe: f => { f('#8a5a2b',7,2,2,12); f('#c0c4cc',3,2,10,3); f('#8a8e98',3,4,10,1); f('#e0e4ec',4,2,5,1); },
  seeds: f => { f('#f4e2b8',3,2,10,13); f('#d9503a',3,2,10,4); f('#7ad07a',6,8,4,4); f('#4fa66a',7,6,2,3); f('#c9a070',3,13,10,2); },
  can: f => { f('#6a9ad0',3,6,8,8); f('#4f7ab0',3,12,8,2); f('#6a9ad0',11,8,2,2); f('#6a9ad0',12,4,3,5); f('#8fb8e8',3,6,8,2); f('#4f7ab0',5,3,5,3); f('#6ec6ff',14,3,1,1); },
  basket: f => { f('#c68642',2,7,12,7); f('#a8662c',2,12,12,2); f('#e0a860',2,7,12,1); f('#a8662c',4,3,1,5); f('#a8662c',11,3,1,5); f('#a8662c',4,2,8,1); f('#e83a4a',5,5,3,3); f('#e83a4a',9,5,3,3); },
  resume: f => { f('#fff6e6',3,1,10,14); f('#e0577a',5,3,6,2); f('#c9b88e',5,7,6,1); f('#c9b88e',5,9,6,1); f('#c9b88e',5,11,4,1); f('#c9b88e',3,1,10,1); },
  code: f => { f('#4a3a6e',1,2,14,12); f('#6a5a9e',1,2,14,2); f('#7ad0ff',3,6,2,1); f('#7ad0ff',4,7,1,1); f('#7ad0ff',3,8,2,1); f('#ffd24a',7,9,3,1); f('#ff8fb4',11,6,2,1); f('#ff8fb4',11,8,2,1); },
  linkedin: f => { f('#3f7fe0',1,1,14,14); f('#fff',4,7,2,5); f('#fff',4,4,2,2); f('#fff',8,7,2,5); f('#fff',10,7,3,2); f('#fff',12,9,1,3); },
  mail: f => { f('#fff6e6',1,3,14,10); f('#e0577a',1,3,14,1); for (let k=0;k<6;k++){ f('#c9b88e',1+k,4+k,1,1); f('#c9b88e',14-k,4+k,1,1); } },
  leaf: f => { f('#ff9fc4',3,3,10,10); f('#ffb8d3',5,2,6,3); f('#e0577a',7,6,2,2); f('#4fa66a',7,12,2,3); },
  clock: f => { f('#fff6e6',2,2,12,12); f('#4a2e18',2,2,12,1); f('#4a2e18',2,13,12,1); f('#4a2e18',2,2,1,12); f('#4a2e18',13,2,1,12); f('#4a2e18',7,4,2,5); f('#4a2e18',7,8,4,2); },
  note: f => { f('#4a2e18',5,2,2,10); f('#4a2e18',5,2,7,2); f('#4a2e18',10,2,2,8); f('#ff7aa8',3,10,4,4); f('#ff7aa8',8,8,4,4); },
  book: f => { f('#c0502a',2,2,12,12); f('#e07a4a',2,2,12,2); f('#fff6e6',4,4,8,9); f('#c9b88e',6,6,5,1); f('#c9b88e',6,8,5,1); f('#c9b88e',6,10,3,1); }
};
const SLOTS = [ ['hoe','Hoe: till the soil'], ['seeds','Seeds: plant strawberries'], ['can','Watering can'], ['basket','Basket: harvest'], ['resume','Download my resume'], ['code','My GitHub'], ['linkedin','My LinkedIn'], ['mail','Email me'], ['leaf','Change season'], ['clock','Time speed'], ['note','Sound'], ['book','Journal (J)'] ];
const hb = $('#hotbar');
SLOTS.forEach(([ic,tip],i) => {
  const b = document.createElement('button'); b.className = 'slot'+(i===4||i===8?' sep':''); b.dataset.i = i; b.setAttribute('aria-label',tip); b.innerHTML = `<b>${i<9?i+1:i===9?0:i===10?'-':'='}</b><canvas width="16" height="16"></canvas>`;
  hb.appendChild(b); const x = b.querySelector('canvas').getContext('2d'); ICONS[ic]((col,a,bb,w,h) => { x.fillStyle = col; x.fillRect(a,bb,w,h); });
  b.addEventListener('pointerenter',() => showTip(tip)); b.addEventListener('pointerleave',() => showTip(''));
  b.addEventListener('click',e => { e.stopPropagation(); useSlot(i); });
});
function showTip(t){ const e = $('#tip'); e.textContent = t; e.classList.toggle('on',!!t); }
function selSlot(i){ S.sel = i; document.querySelectorAll('.slot').forEach((s,k) => s.classList.toggle('sel',k===i)); }
function updateHud(){ ICONS.leaf && icon('#seasonic',f => { const c = ['#ff9fc4','#7ad07a','#f0883a','#d8ecff'][S.season]; f(c,3,3,10,10); f('#fff',6,6,3,3); f('#4fa66a',7,12,2,3); });
  icon('#coinic',f => { f('#e0a020',1,1,10,10); f('#ffd24a',2,2,8,8); f('#fff2a8',3,3,2,2); f('#e0a020',5,4,2,5); }); icon('#berryic',f => { f('#e83a4a',2,3,8,7); f('#ff7a86',3,4,2,2); f('#3f9a3f',3,1,6,2); f('#e83a4a',4,10,4,1); }); icon('#mapic',f => { f('#fff6e6',1,2,10,8); f('#c0502a',2,3,3,3); f('#7ad07a',6,5,3,3); f('#c9b88e',1,2,10,1); }); }
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'),2600); }

/* ================= tools & slots ================= */
let audio = null;
function tone(f,d=.08,v=.04,w=0,type='square'){ if (!S.sound) return; try { audio = audio||new (window.AudioContext||window.webkitAudioContext)(); const o = audio.createOscillator(), gn = audio.createGain(), t0 = audio.currentTime+w; o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(v,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(gn).connect(audio.destination); o.start(t0); o.stop(t0+d+.02); } catch(e){} }
function useSlot(i){
  if (i<4){ selSlot(i); tone(600+i*80,.05); showTip(SLOTS[i][1]); setTimeout(() => showTip(''),1200); return; }
  if (i===4){ const a = document.createElement('a'); a.href = D.resume; a.download = 'Lan-Anh-Do-Resume.pdf'; a.click(); toast('Resume is downloading ⬇'); tone(880,.1); }
  else if (i===5) window.open(D.github,'_blank','noopener'); else if (i===6) window.open(D.linkedin,'_blank','noopener'); else if (i===7) location.href = 'mailto:'+D.email;
  else if (i===8){ S.season = (S.season+1)%4; buildSprites(); updateHud(); toast(`${SEAS[S.season].name} on the farm ✿`); tone(700,.1); }
  else if (i===9){ S.speed = S.speed===1?6:S.speed===6?0:1; toast(['time is paused','','','','','','time flies ⏩'][S.speed]||'normal time'); tone(520,.06); }
  else if (i===10){ S.sound = !S.sound; toast(S.sound?'sound on ♪':'sound off'); tone(988,.1); }
  else if (i===11) toggleJournal();
}
function plotAt(wx,wy){ const i = Math.floor(wx/TS), j = Math.floor(wy/TS); return PLOTS.find(p => p.i===i && p.j===j); }
function useTool(p){
  const k = S.sel; const cx = (p.i+.5)*TS, cy = (p.j+.5)*TS;
  if (k===0){ if (p.st===0){ p.st = 1; spawn(cx,cy,'#8a5a3a',8); tone(240,.07,.05,0,'sawtooth'); } else say('already tilled',cx,cy-20); }
  else if (k===1){ if (p.st===0){ p.st = 1; spawn(cx,cy,'#8a5a3a',5); } if (p.stage<0){ p.stage = 0; p.t = 0; spawn(cx,cy,'#f4e2b8',5); tone(520,.06); } else say('already planted',cx,cy-20); }
  else if (k===2){ if (p.stage>=0 && p.stage<4 && !p.wet){ p.wet = true; spawn(cx,cy-6,'#6ec6ff',9,-.6); tone(400,.12,.03,0,'sine'); } else say(p.stage<0?'plant seeds first':'no need',cx,cy-20); }
  else if (k===3){ if (p.stage===4){ p.stage = -1; p.wet = false; p.t = 0; S.berries++; S.coins += 8; spawn(cx,cy-6,'#e83a4a',10); spawn(cx,cy-6,'#ffd24a',6); tone(988,.08); tone(1319,.14,.04,.08); toast('Harvested a strawberry! +8 coins'); save(); } else say(p.stage<0?'nothing here':'not ripe yet',cx,cy-20); }
}
document.querySelector('#cv').addEventListener('click',e => {
  if (S.open||S.jrn) return;
  const wx = e.clientX/SC+cam.x, wy = e.clientY/SC+cam.y;
  for (const c of CHICKS){ if (Math.abs(wx-c.x)<9 && wy>c.y-14 && wy<c.y+4){ say(['bawk!','cluck cluck','bok bok!'][Math.floor(Math.random()*3)],c.x,c.y-20); spawn(c.x,c.y-10,'#fff',4); tone(700,.05); return; } }
  for (let k=0;k<PLACES.length;k++){ const p = PLACES[k], b = SPR.b[k], bx = p.fx*TS-b.ox, by = (p.fy+p.fh)*TS-b.c.height; if (wx>=bx && wx<=bx+b.c.width && wy>=by && wy<=(p.fy+p.fh)*TS){ walkTo(p.dx,p.dy,() => openPlace(k)); return; } }
  const pl = plotAt(wx,wy);
  if (pl){ const d = Math.hypot(P.x-(pl.i+.5)*TS,P.y-(pl.j+.5)*TS); if (d<TS*3.2){ P.face = (pl.i+.5)*TS>P.x?1:-1; useTool(pl); } else walkTo(pl.i,pl.j+1,() => { P.face = (pl.i+.5)*TS>P.x?1:-1; useTool(pl); }); return; }
  walkTo(clamp(Math.floor(wx/TS),0,MW-1),clamp(Math.floor(wy/TS),0,MH-1));
  spawn(wx,wy,'#fff3a0',4,-.4);
});

/* ================= dialogs ================= */
function openPlace(k){
  const p = PLACES[k]; S.open = k; P.path = null;
  $('#dtitle').textContent = `${p.name} · ${p.title}`; $('#dsay').textContent = p.say;
  $('#db').innerHTML = C.get(p.id); C.wire($('#db')); $('#db').scrollTop = 0; drawPortrait();
  $('#veil').classList.add('on'); $('#dlg').classList.add('on');
  if (!S.visited.has(k)){ S.visited.add(k); S.coins += 25; save(); toast(`New place discovered! +25 coins (${S.visited.size}/6)`); spawn(P.x,P.y-40,'#ffd24a',14); if (S.visited.size===6) setTimeout(() => toast('🌟 You explored the whole farm!'),2800); }
  tone(659,.08); tone(988,.12,.04,.08); renderJournal();
}
function closeDlg(){ S.open = null; $('#veil').classList.remove('on'); $('#dlg').classList.remove('on'); tone(440,.08); }
$('#dx').addEventListener('click',closeDlg); $('#dclose').addEventListener('click',closeDlg); $('#veil').addEventListener('click',() => { closeDlg(); closeJournal(); });
$('#dnext').addEventListener('click',() => { const k = ((S.open??0)+1)%6; closeDlg(); const p = PLACES[k]; walkTo(p.dx,p.dy,() => openPlace(k)); });
function renderJournal(){ $('#jl').innerHTML = PLACES.map((p,k) => `<li><span class="ck">${S.visited.has(k)?'✔':''}</span><div>${p.name}<small>${p.title}</small></div><button class="btn" data-k="${k}">go ▸</button></li>`).join(''); }
function toggleJournal(){ if (S.open!==null) return; S.jrn = !S.jrn; $('#jrn').classList.toggle('on',S.jrn); $('#veil').classList.toggle('on',S.jrn); if (S.jrn) renderJournal(); tone(520,.06); }
function closeJournal(){ if (S.jrn){ S.jrn = false; $('#jrn').classList.remove('on'); $('#veil').classList.remove('on'); } }
$('#jx').addEventListener('click',closeJournal);
$('#jl').addEventListener('click',e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = +b.dataset.k, p = PLACES[k]; closeJournal(); walkTo(p.dx,p.dy,() => openPlace(k)); });

/* ================= input ================= */
const KM = { ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down' };
addEventListener('keydown',e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key==='Escape'){ if (S.open!==null) closeDlg(); else closeJournal(); return; }
  if (S.open!==null){ if (e.key==='e'||e.key==='E') closeDlg(); return; }
  const m = KM[e.key]; if (m){ keys[m] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); if (S.jrn) return; return; }
  if (e.key==='e'||e.key==='E'||e.key==='Enter'){ const d = nearDoor(); if (d) openPlace(PLACES.indexOf(d)); else { const pl = PLOTS.map(p => [p,Math.hypot(P.x-(p.i+.5)*TS,P.y-(p.j+.5)*TS)]).sort((a,b) => a[1]-b[1])[0]; if (pl && pl[1]<TS*2.6) useTool(pl[0]); } }
  else if (e.key==='j'||e.key==='J') toggleJournal();
  else if (/^[1-9]$/.test(e.key)) useSlot(+e.key-1); else if (e.key==='0') useSlot(9); else if (e.key==='-') useSlot(10); else if (e.key==='=') useSlot(11);
});
addEventListener('keyup',e => { const m = KM[e.key]; if (m) keys[m] = false; });
addEventListener('blur',() => { for (const k in keys) keys[k] = false; });
addEventListener('resize',resize);

/* ================= boot ================= */
resize(); buildSprites(); updateHud(); selSlot(0); renderJournal();
const qs = new URLSearchParams(location.search);
if (qs.has('season')){ S.season = +qs.get('season'); buildSprites(); updateHud(); }
if (qs.has('t')) S.min = +qs.get('t');
if (qs.has('at')){ const p = PLACES[+qs.get('at')]; P.x = (p.dx+.5)*TS; P.y = (p.dy+1.2)*TS; }
if (qs.has('open')) setTimeout(() => openPlace(+qs.get('open')),300);
cam.x = clamp(P.x-VW/2,0,MW*TS-VW); cam.y = clamp(P.y-26-VH/2,0,MH*TS-VH);
let last = performance.now();
function frame(now){ const dt = Math.min(.05,(now-last)/1000||.016); last = now; update(dt); render(); requestAnimationFrame(frame); }
(document.fonts && document.fonts.ready || Promise.resolve()).then(() => { buildSprites(); });
requestAnimationFrame(frame);
window.__t = { S, P, cam, step(n=1,dt=.016){ for (let i=0;i<n;i++) update(dt); render(); }, openPlace, walkTo, PLOTS, useTool, PLACES, tp(x,y){ P.x = x*TS; P.y = y*TS; cam.x = clamp(P.x-VW/2,0,MW*TS-VW); cam.y = clamp(P.y-26-VH/2,0,MH*TS-VH); render(); } };
})();
</script>
